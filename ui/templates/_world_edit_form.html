{# ─── 设定编辑表单（原 world_card.html 迁移；依赖页面级全局 BOOK_ID / __BI__ / __BOOK_TITLE__）─── #}
<div class="world-edit">
    <div id="gen-status" class="gen-status"></div>

    <form id="world-form" class="form-grid">
        <fieldset>
            <legend>🗺️ 世界观</legend>
            {# 一句话设定 description 已从书详情页移除（用户要求）：数据仍存
               basic_info.world_building.description，保留隐藏值供保存/重生成逻辑读取，不展示可编辑字段 #}
            <input type="hidden" id="world-idea">
            <div id="wb-tags-display" class="form-row hint" style="display:none"></div>
            <div id="candidate-box"></div>
            <div class="form-row">
                <label>设定概述 world_summary</label>
                <textarea id="wb-world_summary" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea>
            </div>
            <div class="form-row half">
                <div><label>时代 era</label><textarea id="wb-era" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
                <div><label>力量体系 power_system</label><textarea id="wb-power_system" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
            </div>
            <div class="form-row half">
                <div><label>地理 geography</label><textarea id="wb-geography" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
                <div><label>文化 culture</label><textarea id="wb-culture" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
            </div>
            <div class="form-row half">
                <div><label>历史 history</label><textarea id="wb-history" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
                <div><label>社会结构 social_structure</label><textarea id="wb-social_structure" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea></div>
            </div>
            <div class="form-row">
                <label>核心矛盾 core_conflict</label>
                <textarea id="wb-core_conflict" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea>
            </div>
            <div class="form-row">
                <label>世界规则 rules</label>
                <textarea id="wb-rules" rows="3" style="overflow:hidden;resize:vertical" oninput="autoSizeTextarea(this)"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>⚔️ 势力与人物</legend>
            <div id="wb-factions"></div>
            <div class="btn-row">
                <button type="button" class="btn-secondary" onclick="addFactionRow()">➕ 添加势力</button>
                <button type="button" class="btn-secondary" onclick="addCharCard()">➕ 添加人物</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>🎭 基调</legend>
            <div class="form-row half">
                <div>
                    <label>基调 tone</label>
                    <select id="bi-tone">
                        <option value="">（留空由 AI）</option>
                        <option>轻松</option><option>沉重</option><option>热血</option><option>幽默</option>
                    </select>
                </div>
                <div>
                    <label>目标读者</label>
                    <select id="bi-target_audience">
                        <option value="">（留空由 AI）</option>
                        <option>男频</option><option>女频</option>
                    </select>
                </div>
            </div>
            <div class="form-row half">
                <div>
                    <label>视角 pov</label>
                    <select id="bi-pov">
                        <option value="">（留空由 AI）</option>
                        <option>第一人称</option><option>第三人称</option>
                    </select>
                </div>
                <div>
                    <label>时代语言 era_language</label>
                    <input id="bi-era_language" placeholder="如：禁晚于2030年的网络新词">
                </div>
            </div>
        </fieldset>

        <div class="form-row hint">✍️ 修改自动保存（编辑后约 1 秒落盘）。「确认并进入大纲生成」已移除——可让侧栏 Agent 继续生成大纲。</div>
    </form>
</div>

<script>
function $(id){ return document.getElementById(id); }

/* —— basic_info <-> 表单 —— */
var __ARCHETYPES__ = [];   // 角色原型库缓存（/api/characters）

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/* textarea 自动增高：内容多时完全展开，不出现滚动条 */
function autoSizeTextarea(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
}
function emptyChar() {
    return {name:'', role:'配角', importance:2, identity:'', title:'', gender:'', personality:'',
            catchphrase:'', brief:'', golden_finger:'', faction:'', age:0, death_year:0,
            archetype_id:'', relations:[]};
}
function legacyChars(bi) {
    /* 旧结构 basic_info（protagonist + supporting_cast）→ characters 数组（兜底兼容） */
    var out = [];
    var p = bi.protagonist || {};
    if (p.name) {
        out.push({name: p.name, role: '主角', identity: p.identity || '',
                  personality: p.personality || '', golden_finger: p.golden_finger || '',
                  brief: p.background || '', gender: p.gender || '',
                  age: p.age || 0, death_year: p.death_year || 0, catchphrase: '', title: '',
                  archetype_id: '', relations: []});
    }
    var mc = (out[0] || {}).name || '';
    (bi.supporting_cast || []).forEach(function(c) {
        if (!c.name) return;
        var rels = [];
        if (c.relation && mc) rels.push({name: mc, relation: c.relation});
        out.push({name: c.name, role: c.role || '配角', identity: c.role || '',
                  personality: c.personality || '', golden_finger: '', brief: c.brief || '',
                  gender: c.gender || '', age: c.age || 0, death_year: c.death_year || 0,
                  catchphrase: c.catchphrase || '', title: c.title || '',
                  archetype_id: c.archetype_id || '', relations: rels});
    });
    return out;
}

/* —— 势力编辑器（结构化行列表：名称/立场/描述） —— */
function appendFactionRow(f) {
    f = f || {};
    var row = document.createElement('div');
    row.className = 'faction-row faction-card';
    row.dataset.faction = f.name || '';
    row.style.cssText = 'margin:6px 0;padding:10px;border:1px solid #30363d;border-radius:8px;background:#0d1117';
    row.innerHTML = '<div class="f-line" style="display:flex;gap:8px;flex-wrap:wrap">'
        + '<div style="flex:1;min-width:140px"><label>名称 name</label><input class="f-name" placeholder="势力名" value="' + esc(f.name || '') + '"></div>'
        + '<div style="flex:1;min-width:150px"><label>立场 stance</label><input class="f-stance" placeholder="如：主角阵营/反派/中立" value="' + esc(f.stance || '') + '"></div>'
        + '<div style="flex:2;min-width:180px"><label>描述 desc</label><input class="f-desc" placeholder="可选" value="' + esc(f.desc || '') + '"></div>'
        + '<button type="button" class="small" style="align-self:flex-end" onclick="removeFactionRow(this)">✕</button>'
        + '</div>'
        + '<div class="f-members"></div>'
        + '<div class="f-char-toggle accordion-header"><span>👥 人物 <span class="f-char-count">0 人</span></span><span class="f-chev">▸</span></div>'
        + '<div class="f-char-body accordion-body"></div>';
    var wrap = $('wb-factions');
    if (wrap) wrap.appendChild(row);
    return row;
}
function addFactionRow() {
    appendFactionRow({});
    refreshFactionSelects();
    syncFactionMembers();
    scheduleAutoSave();
}
function removeFactionRow(btn) {
    var row = btn.closest('.faction-row');
    // 先把该势力成员人物卡移回「未归属」，再删势力卡（否则卡内人物会被一起删掉）
    row.querySelectorAll('.char-card').forEach(function(card) {
        var sel = card.querySelector('.cc[data-f="faction"]');
        if (sel) sel.value = '';
        moveCharCard(card, '');
    });
    row.remove();
    refreshFactionSelects();
    syncFactionMembers();
    scheduleAutoSave();
}
function renderFactions(fs) {
    var wrap = $('wb-factions');
    if (!wrap) return;
    wrap.innerHTML = '';
    var list = (fs && fs.length) ? fs : [null];
    list.forEach(function(f) {
        if (typeof f === 'string') f = {name: f};
        appendFactionRow(f || {});
    });
}
/* 「未归属」卡：不收进 collectFactions/factionNames（无 .faction-row / .f-name） */
function buildUnassignedCard() {
    var card = document.createElement('div');
    card.className = 'faction-card unassigned-card';
    card.dataset.faction = '（未归属）';
    card.style.cssText = 'margin:6px 0;padding:10px;border:1px dashed #30363d;border-radius:8px;background:#0d1117';
    card.innerHTML = '<div class="f-char-toggle accordion-header"><span>🏷 （未归属） <span class="f-char-count">0 人</span></span><span class="f-chev">▸</span></div>'
        + '<div class="f-char-body accordion-body"></div>';
    return card;
}
function ensureUnassigned() {
    var wrap = $('wb-factions');
    if (!wrap) return;
    if (!wrap.querySelector('.unassigned-card')) wrap.appendChild(buildUnassignedCard());
}
function collectFactions() {
    var out = [];
    document.querySelectorAll('#wb-factions .faction-row').forEach(function(row) {
        var name = row.querySelector('.f-name').value.trim();
        var stance = row.querySelector('.f-stance').value.trim();
        var desc = row.querySelector('.f-desc').value.trim();
        if (name) out.push({name: name, stance: stance, desc: desc});
    });
    return out;
}
function factionNames() {
    var names = [];
    document.querySelectorAll('#wb-factions .faction-row .f-name').forEach(function(i) {
        var v = i.value.trim(); if (v) names.push(v);
    });
    return names;
}
/* 人物卡「所属势力」下拉选项：当前势力名 + 空「未归属」 */
function factionOptions(selected) {
    var opts = '<option value="">（未归属）</option>';
    factionNames().forEach(function(n) {
        opts += '<option value="' + esc(n) + '"' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>';
    });
    return opts;
}

/* —— 势力↔人物 双向联动：势力行内列成员，与人物卡「所属势力」下拉同步 —— */
/* 把所有人物卡当前所属势力重灌到各势力行的成员区（姓名 tag + 添加下拉） */
function syncFactionMembers() {
    var chars = document.querySelectorAll('#wb-factions .char-card');
    document.querySelectorAll('#wb-factions .faction-row').forEach(function(row) {
        var wrap = row.querySelector('.f-members');
        if (!wrap) return;
        var fname = row.querySelector('.f-name').value.trim();
        wrap.innerHTML = '';
        if (!fname) {
            var hint = document.createElement('span');
            hint.textContent = '（填好势力名后，可在此把人物加入本势力）';
            hint.style.color = '#8b949e';
            wrap.appendChild(hint);
            return;
        }
        var taken = {};
        chars.forEach(function(card) {
            var nEl = card.querySelector('.cc[data-f="name"]');
            var name = nEl ? nEl.value.trim() : '';
            var fEl = card.querySelector('.cc[data-f="faction"]');
            if (!name || !fEl || fEl.value !== fname) return;
            var role = (card.querySelector('.cc[data-f="role"]') || {}).value || '';
            var tag = document.createElement('span');
            tag.className = 'f-member-tag';
            tag.setAttribute('data-name', name);
            tag.appendChild(document.createTextNode(name + (role === '主角' ? ' ⭐' : '')));
            var rm = document.createElement('span');
            rm.className = 'f-rm';
            rm.textContent = '✕';
            rm.title = '移出本势力';
            rm.onclick = function() { removeFactionMember(tag); };
            tag.appendChild(rm);
            wrap.appendChild(tag);
            taken[name] = true;
        });
        var sel = document.createElement('select');
        sel.className = 'f-add-member';
        var ph = document.createElement('option');
        ph.value = '';
        ph.textContent = '＋ 添加成员';
        sel.appendChild(ph);
        var free = 0;
        chars.forEach(function(card) {
            var nEl = card.querySelector('.cc[data-f="name"]');
            var name = nEl ? nEl.value.trim() : '';
            if (!name || taken[name]) return;
            var o = document.createElement('option');
            o.value = name;
            o.textContent = name;
            sel.appendChild(o);
            free++;
        });
        if (!free) sel.disabled = true;
        wrap.appendChild(sel);
    });
}
/* 定位某势力卡的成员 body（.f-char-body）；未归属缺失时自动补未分组卡。label 为空 = 未归属 */
function findFactionBody(label) {
    var group = String(label || '').trim() || '（未归属）';
    var found = null;
    document.querySelectorAll('#wb-factions .faction-card').forEach(function(card) {
        if (card.dataset.faction === group) found = card.querySelector('.f-char-body');
    });
    if (found) return found;
    if (group === '（未归属）') {
        ensureUnassigned();
        return $('wb-factions').querySelector('.unassigned-card .f-char-body');
    }
    var row = appendFactionRow({name: group});
    return row.querySelector('.f-char-body');
}
/* 把人物卡 DOM 移到对应势力卡的成员区；展开目标区让用户看到去向。label 为空 = 未归属 */
function moveCharCard(card, label) {
    if (!card) return;
    var body = findFactionBody(label);
    var current = card.closest('.faction-card');
    var curBody = current ? current.querySelector('.f-char-body') : null;
    if (curBody && curBody !== body) curBody.removeChild(card);
    if (card.parentElement !== body) body.appendChild(card);
    body.classList.add('show');
    refreshGroupCounts();
}
/* 按姓名定位人物卡并改其所属势力（空 = 未归属），同步分组与势力行 */
function setCharFaction(charName, factionName) {
    var card = null;
    document.querySelectorAll('#wb-factions .char-card').forEach(function(c) {
        var n = c.querySelector('.cc[data-f="name"]');
        if (!card && n && n.value.trim() === charName) card = c;
    });
    if (!card) { showToast('未找到人物「' + charName + '」'); return; }
    // 先重灌下拉保证目标选项存在（否则 select.value 赋不存在的值会被清空）
    refreshFactionSelects();
    card.querySelector('.cc[data-f="faction"]').value = String(factionName || '');
    moveCharCard(card, factionName);
    syncFactionMembers();
    scheduleAutoSave();
}
function addFactionMember(sel) {
    var name = sel.value;
    if (!name) return;
    var row = sel.closest('.faction-row');
    var f = row.querySelector('.f-name').value.trim();
    if (!f) { showToast('请先填势力名'); sel.value = ''; return; }
    setCharFaction(name, f);
}
function removeFactionMember(tag) {
    var name = tag.getAttribute('data-name');
    if (name) setCharFaction(name, '');
}
/* 势力改名：同步人卡 select 值、手风琴标题；改名成空 = 成员退回未归属 */
function handleFactionRename(input) {
    var old = input.dataset.prev || '';
    var neu = input.value.trim();
    if (old === neu) return;
    input.dataset.prev = neu;
    // 记录改名前归属该势力的人卡（旧名选项随后从下拉消失，值会被清空）
    var targets = [];
    document.querySelectorAll('#wb-factions .cc[data-f="faction"]').forEach(function(sel) {
        if (sel.value === old) targets.push(sel);
    });
    if (neu) {
        document.querySelectorAll('#wb-factions .faction-card').forEach(function(card) {
            if (card.dataset.faction === old) card.dataset.faction = neu;
        });
    } else {
        // 改名成空 = 该势力成员退回未归属
        targets.forEach(function(sel) {
            sel.value = '';
            moveCharCard(sel.closest('.char-card'), '');
        });
    }
    // 先重灌全部下拉（含新名选项），再把旧名下的人卡固化到新名
    refreshFactionSelects();
    targets.forEach(function(sel) { if (neu) sel.value = neu; });
    syncFactionMembers();
    scheduleAutoSave();
}
/* 增删/改名势力后，重灌所有人卡「所属势力」下拉设选项（保留当前选中） */
function refreshFactionSelects() {
    document.querySelectorAll('#wb-factions .cc[data-f="faction"]').forEach(function(sel) {
        var cur = sel.value;
        sel.innerHTML = factionOptions(cur);
    });
}

/* —— 人物条目卡片渲染 —— */
function appendCharCard(c, container) {
    c = c || emptyChar();
    var card = document.createElement('div');
    card.className = 'char-card';
    card.style.cssText = 'border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:12px;background:#0d1117';
    card.innerHTML =
        '<div class="form-row half">'
        + '<div><label>姓名</label><input class="cc" data-f="name" value="' + esc(c.name) + '"></div>'
        + '<div><label>角色</label><select class="cc" data-f="role">'
        + ['主角','配角','反派','其他'].map(function(r){ return '<option' + (c.role===r?' selected':'') + '>' + r + '</option>'; }).join('')
        + '</select></div></div>'
        + '<div class="form-row half">'
        + '<div><label>重要度（1最高）</label><select class="cc" data-f="importance">'
        + [1,2,3,4,5].map(function(n){ return '<option value="' + n + '"' + (String(c.importance || 2)===String(n)?' selected':'') + '>' + n + '</option>'; }).join('')
        + '</select></div>'
        + '<div></div></div>'
        + '<div class="form-row half">'
        + '<div><label>身份/职业</label><input class="cc" data-f="identity" value="' + esc(c.identity) + '"></div>'
        + '<div><label>称呼</label><input class="cc" data-f="title" value="' + esc(c.title) + '"></div></div>'
        + '<div class="form-row half">'
        + '<div><label>所属势力</label><select class="cc" data-f="faction">' + factionOptions(c.faction) + '</select></div>'
        + '<div></div></div>'
        + '<div class="form-row half">'
        + '<div><label>性别</label><input class="cc" data-f="gender" placeholder="男/女" value="' + esc(c.gender) + '"></div>'
        + '<div><label>性格</label><input class="cc" data-f="personality" value="' + esc(c.personality) + '"></div></div>'
        + '<div class="form-row half">'
        + '<div><label>口癖</label><input class="cc" data-f="catchphrase" value="' + esc(c.catchphrase) + '"></div>'
        + '<div><label>简介</label><input class="cc" data-f="brief" value="' + esc(c.brief) + '"></div></div>'
        + '<div class="form-row half">'
        + '<div><label>金手指</label><input class="cc" data-f="golden_finger" placeholder="仅主角/有金手指角色填写，配角可留空" value="' + esc(c.golden_finger) + '"></div>'
        + '<div style="display:flex;gap:8px"><div style="flex:1"><label>年龄</label><input class="cc" data-f="age" type="number" min="0" value="' + (c.age||0) + '"></div>'
        + '<div style="flex:1"><label>死亡年份</label><input class="cc" data-f="death_year" type="number" min="0" value="' + (c.death_year||0) + '"></div></div></div>'
        + '<div class="form-row" style="align-items:center;gap:8px">'
        + '<select class="char-archetype" style="max-width:220px"></select>'
        + '<button type="button" class="small" onclick="applyArchetype(this)">🎭 套用原型</button>'
        + '<button type="button" class="small danger" style="margin-left:auto" onclick="removeCharCard(this)">🗑 删除此人</button></div>'
        + '<div class="char-relations">'
        + '<div style="font-size:12px;color:#8b949e;margin:6px 0 4px">人物关系（对方姓名 / 关系）</div>'
        + '<div class="rel-rows"></div>'
        + '<button type="button" class="small" onclick="addRelRow(this)">➕ 加关系</button></div>';
    (container || $('wb-factions')).appendChild(card);
    var sel = card.querySelector('.char-archetype');
    var opts = '<option value="">（无原型）</option>';
    __ARCHETYPES__.forEach(function(a) {
        opts += '<option value="' + esc(a.id) + '"' + (c.archetype_id === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
    });
    sel.innerHTML = opts;
    var relWrap = card.querySelector('.rel-rows');
    (c.relations || []).forEach(function(r) { appendRelRow(relWrap, r.name, r.relation); });
}
function renderCharCards(chars) {
    chars = (chars && chars.length) ? chars : [emptyChar()];
    ensureUnassigned();
    // 把人物按所属势力分发进各势力卡的成员区；未归属 → 未分组卡
    document.querySelectorAll('#wb-factions .faction-card').forEach(function(card) {
        var body = card.querySelector('.f-char-body');
        if (!body) return;
        body.innerHTML = '';
        var fname = (card.dataset.faction === '（未归属）')
            ? '（未归属）'
            : (card.querySelector('.f-name') ? card.querySelector('.f-name').value.trim() : '');
        chars.forEach(function(c) {
            var cf = String(c.faction || '').trim() || '（未归属）';
            if (cf === fname) appendCharCard(c, body);
        });
    });
    refreshGroupCounts();
    syncFactionMembers();
}
/* 刷新各势力卡/未分组卡的成员计数与展开箭头（点开/收起由全局 .accordion-header 点击负责） */
function refreshGroupCounts() {
    document.querySelectorAll('#wb-factions .faction-card').forEach(function(card) {
        var body = card.querySelector('.f-char-body');
        var num = card.querySelector('.f-char-count');
        var n = body ? body.querySelectorAll('.char-card').length : 0;
        if (num) num.textContent = n + ' 人';
        var chev = card.querySelector('.f-chev');
        if (chev) chev.textContent = (body && body.classList.contains('show')) ? '▾' : '▸';
    });
}
function addCharCard() {
    ensureUnassigned();
    var card = $('wb-factions').querySelector('.unassigned-card');
    var body = card.querySelector('.f-char-body');
    appendCharCard(emptyChar(), body);
    body.classList.add('show');
    refreshGroupCounts();
    syncFactionMembers();
    scheduleAutoSave();
}
function removeCharCard(btn) {
    if (!confirm('删除这条人物？')) return;
    btn.closest('.char-card').remove();
    refreshGroupCounts();
    syncFactionMembers();
    scheduleAutoSave();
}
function applyArchetype(btn) {
    var card = btn.closest('.char-card');
    var id = card.querySelector('.char-archetype').value;
    var a = null;
    for (var i = 0; i < __ARCHETYPES__.length; i++) { if (__ARCHETYPES__[i].id === id) { a = __ARCHETYPES__[i]; break; } }
    if (!a) return;
    card.querySelector('[data-f="personality"]').value = a.personality || '';
    card.querySelector('[data-f="catchphrase"]').value = (a.catchphrases && a.catchphrases[0]) || '';
    card.querySelector('[data-f="brief"]').value = a.description || '';
    showToast('已套用原型「' + a.name + '」', 'info');
    scheduleAutoSave();
}
function appendRelRow(wrap, name, relation) {
    var row = document.createElement('div');
    row.className = 'rel-row';
    row.style.cssText = 'display:flex;gap:6px;margin:4px 0;align-items:center';
    row.innerHTML = '<input class="cc-rel-name" placeholder="对方姓名" value="' + esc(name||'') + '" style="flex:1;min-width:0">'
        + '<input class="cc-rel-rel" placeholder="关系（如：师徒/宿敌/闺蜜）" value="' + esc(relation||'') + '" style="flex:1;min-width:0">'
        + '<button type="button" class="small" onclick="this.closest(\'.rel-row\').remove()">✕</button>';
    wrap.appendChild(row);
}
function addRelRow(btn) { appendRelRow(btn.closest('.char-card').querySelector('.rel-rows')); }
function removeRelRow(btn) { btn.closest('.rel-row').remove(); scheduleAutoSave(); }

function collectCharCards() {
    var out = [];
    document.querySelectorAll('#wb-factions .char-card').forEach(function(card) {
        var c = {};
        card.querySelectorAll('.cc').forEach(function(inp) {
            var k = inp.getAttribute('data-f');
            c[k] = (k === 'age' || k === 'death_year' || k === 'importance')
                ? (parseInt(inp.value, 10) || 0) : inp.value.trim();
        });
        // archetype_id 存于 .char-archetype 下拉（非 .cc），单独收集
        var archSel = card.querySelector('.char-archetype');
        if (archSel) c.archetype_id = archSel.value || '';
        c.relations = [];
        card.querySelectorAll('.rel-row').forEach(function(row) {
            var n = row.querySelector('.cc-rel-name').value.trim();
            var r = row.querySelector('.cc-rel-rel').value.trim();
            if (n) c.relations.push({name: n, relation: r});
        });
        if (c.name) out.push(c);
    });
    return out;
}

function biToForm(bi) {
    bi = bi || {};
    var wb = bi.world_building || {};
    $('world-idea').value = wb.description || '';
    var tags = (wb.tags || []).filter(function(t){ return String(t).trim(); });
    var tagsEl = $('wb-tags-display');
    if (tagsEl) {
        if (tags.length) { tagsEl.style.display = 'block'; tagsEl.textContent = '🏷️ 题材标签（启动向导选定，此处只读）：' + tags.join('、'); }
        else tagsEl.style.display = 'none';
    }
    $('wb-era').value = wb.era || ''; $('wb-power_system').value = wb.power_system || '';
    $('wb-geography').value = wb.geography || ''; $('wb-culture').value = wb.culture || '';
    $('wb-history').value = wb.history || ''; $('wb-social_structure').value = wb.social_structure || '';
    $('wb-core_conflict').value = wb.core_conflict || '';
    ['wb-era','wb-power_system','wb-geography','wb-culture','wb-history','wb-social_structure','wb-core_conflict']
        .forEach(function(id){ autoSizeTextarea($(id)); });
    $('wb-world_summary').value = wb.world_summary || ''; autoSizeTextarea($('wb-world_summary'));
    renderFactions(wb.factions);
    $('wb-rules').value = (wb.rules || []).join('\n'); autoSizeTextarea($('wb-rules'));
    renderCharCards(Array.isArray(bi.characters) ? bi.characters : legacyChars(bi));
    syncFactionMembers();
    $('bi-tone').value = bi.tone || ''; $('bi-target_audience').value = bi.target_audience || '';
    $('bi-pov').value = bi.pov || ''; $('bi-era_language').value = bi.era_language || '';
}
function formToBi() {
    // 标签是启动向导②选定的硬约束，此表单只读透传（保留原值）
    var _origTags = ((typeof __BI__ !== 'undefined' ? __BI__ : {}) || {}).world_building || {};
    _origTags = _origTags.tags || [];
    var wb = {
        description: ($('world-idea').value || '').trim(),
        tags: Array.isArray(_origTags) ? _origTags : [],
        era: $('wb-era').value.trim(), power_system: $('wb-power_system').value.trim(),
        geography: $('wb-geography').value.trim(), culture: $('wb-culture').value.trim(),
        history: $('wb-history').value.trim(), social_structure: $('wb-social_structure').value.trim(),
        core_conflict: $('wb-core_conflict').value.trim(), world_summary: $('wb-world_summary').value.trim(),
        factions: collectFactions(), rules: parseRuleLines($('wb-rules').value),
    };
    return {
        book_title: BOOK_TITLE,
        characters: collectCharCards(),
        world_building: wb,
        tone: $('bi-tone').value, target_audience: $('bi-target_audience').value,
        pov: $('bi-pov').value, era_language: $('bi-era_language').value,
    };
}

/* —— SSE：生成世界观 —— */
function statusShow(msg, cls) {
    var el = $('gen-status');
    el.className = 'gen-status on' + (cls ? ' ' + cls : '');
    el.textContent = msg;
}
function startGenerate(mode) {
    // 借鉴生成已挪到启动新书向导②（/api/world-builder/borrow-preview 无书别名）
    if (mode !== 'one') return;
    var body = {mode: 'one', idea: $('world-idea').value.trim()};
    statusShow('生成中…', '');
    fetch('/api/world-builder/' + BOOK_ID + '/generate', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    }).then(function(resp) {
        var reader = resp.body.getReader();
        var decoder = new TextDecoder();
        var buf = '';
        function read() {
            return reader.read().then(function(r) {
                if (r.done) return;
                buf += decoder.decode(r.value, {stream: true});
                var lines = buf.split('\n');
                buf = lines.pop() || '';
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.indexOf('data: ') !== 0) continue;
                    try { handleGen(JSON.parse(line.slice(6))); } catch(e) {}
                }
                return read();
            });
        }
        return read();
    }).catch(function(err) {
        statusShow('❌ 连接失败: ' + err.message, 'err');
    });
}
function handleGen(evt) {
    if (evt.event === 'phase' || evt.event === 'progress') {
        statusShow(evt.message || '…');
    } else if (evt.event === 'world_summary') {
        statusShow('📝 ' + (evt.summary || ''));
    } else if (evt.event === 'phase_done') {
        statusShow('✅ ' + evt.message);
    } else if (evt.event === 'done') {
        statusShow('✅ 世界观生成完成，已刷新下方设定卡', '');
        if (evt.basic_info) biToForm(evt.basic_info);
    } else if (evt.event === 'error') {
        statusShow('❌ ' + evt.message, 'err');
    }
}

/* —— 示例候选 —— */
function loadCandidates() {
    var idea = $('world-idea').value.trim();
    $('candidate-box').innerHTML = '<div class="gen-status on">生成候选…</div>';
    fetch('/api/world-builder/' + BOOK_ID + '/candidates', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({idea: idea})
    }).then(function(r){ return r.json(); }).then(function(data) {
        if (!data.ok) { $('candidate-box').innerHTML = '<div class="gen-status err">' + data.error + '</div>'; return; }
        var html = '';
        (data.candidates || []).forEach(function(c, idx) {
            html += '<div class="candidate-card" onclick="pickCandidate(' + idx + ')">'
                + '<h4>#' + (idx+1) + ' ' + c.title + '</h4>'
                + '<div class="ob">' + c.one_liner + '</div>'
                + '<div class="ob">' + (c.world_brief || '') + '</div>'
                + '<div class="ob">『' + (c.genre_hint || '') + '』</div>'
                + '</div>';
        });
        window.__CANDIDATES__ = data.candidates || [];
        $('candidate-box').innerHTML = html;
    }).catch(function(err){ $('candidate-box').innerHTML = '<div class="gen-status err">请求失败: ' + err.message + '</div>'; });
}
function pickCandidate(idx) {
    var c = (window.__CANDIDATES__ || [])[idx];
    if (!c) return;
    $('world-idea').value = c.one_liner;
    if (c.world_brief) { $('wb-world_summary').value = c.world_brief; autoSizeTextarea($('wb-world_summary')); }
    $('candidate-box').innerHTML = '';
    statusShow('已选中候选：' + c.one_liner + '。点「🚀 生成世界观」展开。');
}

/* —— 自动保存（修改后防抖落盘，替代原「保存设定 / 确认并进入大纲生成」按钮） —— */
var _saveTimer = null;
function scheduleAutoSave() {
    if (_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(doAutoSave, 800);
}
function doAutoSave() {
    var payload = formToBi();
    if (!payload) return;
    // 保存结果用右上角 toast 提示（#toast-root），不再占用表单顶部内联状态条
    fetch('/api/storyline/' + BOOK_ID + '/save-basic-info', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(data) {
        if (data.ok) showToast('✅ 已自动保存 ' + new Date().toLocaleTimeString(), 'success');
        else showToast('❌ 自动保存失败: ' + (data.error || ''), 'error');
    }).catch(function(err){ showToast('❌ 自动保存失败: ' + err.message, 'error'); });
}

/* 初始化：先取角色原型库，再渲染已有设定到表单（依赖包含页定义 __BI__ / __BOOK_TITLE__） */
var BOOK_TITLE = __BOOK_TITLE__ || '';
// 自动保存：委托监听 #world-form 内所有 input/select/textarea 修改（含动态人物卡/势力行/关系行）；
// 程序化赋值（biToForm）不触发 input，故初始渲染不会误触发保存
// 势力↔人物联动也在此接线：势力改名 / 人物改属 / 人物改名 / 添加成员
document.addEventListener('focusin', function(e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('f-name')) t.dataset.prev = t.value;
});
document.addEventListener('input', function(e) {
    if (e.target && e.target.closest && e.target.closest('#world-form')) scheduleAutoSave();
});
document.addEventListener('change', function(e) {
    var t = e.target;
    if (t && t.closest && t.closest('#world-form')) {
        scheduleAutoSave();
        if (t.classList && t.classList.contains('f-name')) {
            handleFactionRename(t);
        } else if (t.classList && t.classList.contains('cc')) {
            var f = t.getAttribute('data-f');
            if (f === 'faction') {
                syncFactionMembers();
                moveCharCard(t.closest('.char-card'), t.value);
            } else if (f === 'name') {
                syncFactionMembers();
            }
        } else if (t.classList && t.classList.contains('f-add-member')) {
            addFactionMember(t);
        }
    }
});
// 「👥 人物」箭头随展开/收起切换（展开/收起本身复用全局 .accordion-header 点击委托）
document.addEventListener('click', function(e) {
    var t = e.target && e.target.closest ? e.target.closest('.f-char-toggle') : null;
    if (!t) return;
    var body = t.nextElementSibling;
    var chev = t.querySelector('.f-chev');
    if (chev) chev.textContent = (body && body.classList.contains('show')) ? '▾' : '▸';
});
fetch('/api/characters')
    .then(function(r){ return r.json(); })
    .then(function(list){ __ARCHETYPES__ = list || []; biToForm(__BI__ || {}); })
    .catch(function(){ biToForm(__BI__ || {}); });
</script>
