{# 侦察·提取 两步引导条（/scout 步骤一 / /extract 步骤二 共用） #}
{% macro steps(active) %}
<div class="scout-steps">
    <a href="/scout" class="scout-step {{ 'active' if active == 1 else '' }}" title="步骤一：抓取下载到本地书库">
        <span class="num">1</span><span class="label">抓取</span>
    </a>
    <span class="scout-step-arrow">→</span>
    <a href="/extract" class="scout-step {{ 'active' if active == 2 else '' }}" title="步骤二：提炼候选确认入库五库">
        <span class="num">2</span><span class="label">提取到数据库</span>
    </a>
</div>
<style>
.scout-steps { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.scout-step { display: flex; align-items: center; gap: 8px; padding: 8px 18px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    color: #8b949e; text-decoration: none; font-size: 14px; transition: border-color .2s; }
.scout-step:hover { border-color: #8b949e; }
.scout-step .num { width: 22px; height: 22px; border-radius: 50%; background: #21262d;
    color: #8b949e; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; }
.scout-step.active { border-color: #1f6feb; color: #f0f6fc; }
.scout-step.active .num { background: #1f6feb; color: #fff; }
.scout-step-arrow { color: #484f58; font-weight: 600; }
</style>
{% endmacro %}
