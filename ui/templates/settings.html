<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 — NovelEngine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 680px; margin: 0 auto; padding: 24px 20px; }
        .header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 28px;
        }
        .header h1 { font-size: 22px; font-weight: 600; }
        .back-btn {
            color: #8b8ba7; text-decoration: none; font-size: 14px;
            padding: 6px 14px; border-radius: 8px;
            background: #1a1a2e; transition: 0.2s;
        }
        .back-btn:hover { background: #252545; color: #fff; }

        .card {
            background: #16162a; border-radius: 12px;
            padding: 24px; margin-bottom: 16px;
            border: 1px solid #222244;
        }
        .card h2 { font-size: 16px; color: #aaaacc; margin-bottom: 16px; }

        .field { margin-bottom: 18px; }
        .field:last-child { margin-bottom: 0; }
        .field label {
            display: block; font-size: 13px; color: #8888aa;
            margin-bottom: 6px; font-weight: 500;
        }
        .field input, .field select {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid #2a2a4a; background: #1a1a2e;
            color: #e0e0e0; font-size: 14px; font-family: monospace;
            transition: border-color 0.2s;
        }
        .field input:focus, .field select:focus {
            outline: none; border-color: #5a5aff; box-shadow: 0 0 0 2px rgba(90,90,255,0.15);
        }
        .field input::placeholder { color: #555; }
        .field .hint {
            font-size: 12px; color: #666; margin-top: 4px;
            font-family: sans-serif;
        }

        .btn-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn {
            padding: 10px 24px; border-radius: 8px; border: none;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #5a5aff; color: #fff;
        }
        .btn-primary:hover { background: #6b6bff; }
        .btn-secondary {
            background: #252545; color: #aaaacc;
        }
        .btn-secondary:hover { background: #303060; color: #fff; }

        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 12px 20px; border-radius: 8px;
            font-size: 14px; z-index: 1000;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-10px); opacity: 0;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #1a4a2e; color: #8fdfb0; border: 1px solid #2a6a3e; }
        .toast.error { background: #4a1a1a; color: #ff8a8a; border: 1px solid #6a2a2a; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
        }
        .status-badge.online { background: #1a3a2a; color: #6fdf90; }
        .status-badge.offline { background: #3a1a1a; color: #ff6f6f; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .dot.online { background: #4fdf70; }
        .dot.offline { background: #ff4f4f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">← 返回</a>
            <h1>⚙️ 设置</h1>
        </div>

        <div class="card">
            <h2>LLM 配置</h2>
            <div class="field">
                <label for="api_key">API Key</label>
                <input type="password" id="api_key" value="{{ config.api_key }}" placeholder="sk-...">
                <div class="hint">DeepSeek / OpenAI 兼容 API 密钥</div>
            </div>
            <div class="field">
                <label for="base_url">API 地址</label>
                <input type="url" id="base_url" value="{{ config.base_url }}" placeholder="https://api.deepseek.com">
                <div class="hint">OpenAI 兼容 API 的 base URL</div>
            </div>
            <div class="field">
                <label for="model">模型</label>
                <input type="text" id="model" value="{{ config.model }}" placeholder="deepseek-v4-flash">
                <div class="hint">模型名称，如 deepseek-chat、deepseek-v4-flash、gpt-4o 等</div>
            </div>
            <div class="field">
                <label for="http_timeout">API 超时（秒）</label>
                <input type="number" id="http_timeout" value="{{ config.http_timeout_seconds }}" min="10" max="600">
            </div>
            <div class="field">
                <label for="context_budget">上下文预算（tokens）</label>
                <input type="number" id="context_budget" value="{{ config.context_budget_tokens }}" min="10000" max="1000000" step="10000">
                <div class="hint">单次对话最大 token 数预算</div>
            </div>
        </div>

        <div class="card">
            <h2>连接状态</h2>
            <div style="display: flex; align-items: center; gap: 12px;">
                {% if llm_ok %}
                <span class="status-badge online"><span class="dot online"></span> 已连接</span>
                {% else %}
                <span class="status-badge offline"><span class="dot offline"></span> 未连接</span>
                {% endif %}
                <span style="font-size: 13px; color: #666;">{{ config.base_url }}</span>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
            <button class="btn btn-secondary" onclick="testConnection()">🔌 测试连接</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = 'toast ' + type + ' show';
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function saveSettings() {
        const payload = {
            api_key: document.getElementById('api_key').value,
            base_url: document.getElementById('base_url').value,
            model: document.getElementById('model').value,
            http_timeout_seconds: parseInt(document.getElementById('http_timeout').value) || 300,
            context_budget_tokens: parseInt(document.getElementById('context_budget').value) || 300000,
        };
        try {
            const r = await fetch('/api/settings/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            });
            const d = await r.json();
            if (d.ok) showToast('✅ 设置已保存', 'success');
            else showToast('❌ ' + (d.error || '保存失败'), 'error');
        } catch(e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }

    async function testConnection() {
        const payload = {
            api_key: document.getElementById('api_key').value,
            base_url: document.getElementById('base_url').value,
            model: document.getElementById('model').value,
        };
        try {
            const r = await fetch('/api/settings/test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            });
            const d = await r.json();
            if (d.ok) showToast('✅ 连接成功！' + (d.model || ''), 'success');
            else showToast('❌ 连接失败: ' + (d.error || '未知错误'), 'error');
        } catch(e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }
    </script>
</body>
</html>
