{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}?v=20260925">

<div class="st-page">
  <div class="st-header-row">
    <h1>⚙️ 系统设置 <span style="font-size:14px;color:#8b949e;font-weight:normal">（模型与服务配置）</span></h1>
    <div class="st-actions">
      <button id="st-save" class="btn btn-primary" type="button" disabled>✓ 保存设置</button>
    </div>
  </div>

  <div id="st-banner"></div>

  <!-- ── 供应商 ───────────────────── -->
  <section class="st-section st-providers-section">
    <div class="st-section-head">
      <div class="st-head-left">
        <h2>API 供应商</h2>
        <span class="st-count" id="st-provider-count"></span>
      </div>
      <div class="st-actions">
        <button id="st-refresh-models" class="btn btn-ghost" type="button" title="从当前供应商重新拉取完整模型目录并保存">🔄 刷新模型目录</button>
        <button class="btn btn-primary" id="st-add-provider" type="button">➕ 添加供应商</button>
      </div>
    </div>
    <div class="st-grid" id="st-providers"></div>
  </section>

  <!-- ── 角色模型分配 ─────────────────────────────────── -->
  <section class="st-section">
    <div class="st-section-head">
      <div class="st-head-left">
        <h2>角色模型分配</h2>
        <span class="st-hint-inline">为各个创作角色独立分配供应商、模型与思考强度</span>
      </div>
    </div>
    <div class="st-matrix-grid" id="st-routes"></div>
  </section>

  <!-- ── 高级设置 ─────────────────────────────────────────────── -->
  <section class="st-section">
    <details class="st-details">
      <summary>高级设置（后端基础服务 · 上下文预算）</summary>
      <div class="st-details-body">
        <div class="st-card st-route-card st-advanced-route" id="st-backend-route"></div>
        <div class="st-card st-field-row">
          <label class="st-field">
            <span>上下文预算（tokens）</span>
            <input type="number" id="st-context-budget" min="8000" max="2000000" step="10000"
                   value="{{ context_budget_tokens }}">
          </label>
          <p class="st-hint">
            dsh 编排运行时的上下文预算上限（默认 300000），调小会让长任务更早触发上下文压缩。
          </p>
        </div>
      </div>
    </details>
  </section>
</div>

<!-- ── 供应商编辑抽屉 ─────────────────────────────────────── -->
<div class="st-modal-backdrop" id="st-modal" hidden>
  <div class="st-modal" role="dialog" aria-modal="true" aria-labelledby="st-modal-title">
    <div class="st-modal-head">
      <h3 id="st-modal-title">编辑供应商</h3>
      <button class="st-icon-btn" id="st-modal-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="st-modal-body" id="st-modal-body"></div>
    <div class="st-modal-foot">
      <button class="btn btn-ghost" id="st-modal-cancel" type="button">取消</button>
      <button class="btn btn-ghost" id="st-modal-test" type="button">🔌 测试连接</button>
      <button class="btn btn-primary" id="st-modal-ok" type="button">确定</button>
    </div>
    <div class="st-test-result" id="st-modal-test-result" aria-live="polite"></div>
  </div>
</div>

<div id="st-toast-host" class="st-toast-host" aria-live="polite"></div>

<script id="st-bootstrap" type="application/json">{{ settings_view | tojson }}</script>
<script id="st-role-meta" type="application/json">{{ {'order': role_order, 'titles': role_titles, 'descs': role_descs} | tojson }}</script>
<script src="{{ url_for('static', filename='js/settings.js') }}?v=20260925"></script>
{% endblock %}
