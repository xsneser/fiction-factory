{% extends "base.html" %}
{% block content %}
<h1>⚙️ 设置</h1>

<div class="card">
    <h2>LLM 配置</h2>
    <form onsubmit="return false">
        <div class="form-group">
            <label for="api_key">API Key</label>
            <input type="password" id="api_key" value="{{ config.api_key_masked }}" placeholder="sk-..." autocomplete="off">
            {% if config.api_key_masked %}
            <small class="hint">已配置（{{ config.api_key_masked }}），如需修改请整体替换为完整 key；留空提交将保留原 key</small>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="base_url">API 地址</label>
            <input type="url" id="base_url" value="{{ config.base_url }}" placeholder="https://api.deepseek.com">
        </div>
        <div class="form-group">
            <label for="model">模型</label>
            <input type="text" id="model" value="{{ config.model }}" placeholder="deepseek-v4-flash">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="http_timeout">API 超时（秒）</label>
                <input type="number" id="http_timeout" value="{{ config.http_timeout_seconds }}" min="10" max="600">
            </div>
            <div class="form-group">
                <label for="context_budget">上下文预算（tokens）</label>
                <input type="number" id="context_budget" value="{{ config.context_budget_tokens }}" min="10000" max="1000000" step="10000">
            </div>
        </div>
    </form>
</div>

<div id="status-card"></div>

<div style="display:flex;gap:12px;margin-top:20px">
    <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
    <button id="btn-test" class="btn" style="background:#30363d;color:#f0f6fc" onclick="testConnection()">🔌 测试连接</button>
</div>

<div id="settings-toast" style="display:none;position:fixed;top:20px;right:20px;z-index:1000" class="alert"></div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #8b949e;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
}
.hint {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: #8b949e;
    line-height: 1.5;
}
</style>

<script>
(function() {
    var ok = {{ 'true' if llm_ok else 'false' }};
    renderStatus(ok ? 'info' : 'warning', ok ? '📋 已配置 · {{ config.base_url }}' : '⚠️ 未配置 · 请填写 API Key');
})();

function renderStatus(type, msg) {
    var el = document.getElementById('status-card');
    var icons = { info: '📋', success: '✅', warning: '⚠️', error: '❌' };
    el.innerHTML = '<div class="card"><h2>连接状态</h2><div class="alert ' + type + '">' + (icons[type]||'') + ' ' + escapeHtml(msg) + '</div></div>';
}

function showToast(msg, type) {
    var t = document.getElementById('settings-toast');
    t.textContent = msg;
    t.className = 'alert ' + type;
    t.style.display = 'block';
    setTimeout(function(){ t.style.display = 'none'; }, 3000);
}

function getVal(id) {
    return document.getElementById(id).value;
}

async function saveSettings() {
    var payload = {
        base_url: getVal('base_url'),
        model: getVal('model'),
        http_timeout_seconds: parseInt(getVal('http_timeout')) || 300,
        context_budget_tokens: parseInt(getVal('context_budget')) || 300000,
    };
    // 掩码值（含 ****）表示未修改，不提交 api_key，后端保留原 key
    var key = getVal('api_key');
    if (key && key.indexOf('****') === -1) {
        payload.api_key = key;
    }
    try {
        var r = await fetch('/api/settings/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        var d = await r.json();
        showToast(d.ok ? '✅ 设置已保存' : '❌ ' + (d.error || '保存失败'), d.ok ? 'success' : 'error');
    } catch(e) {
        showToast('❌ 请求失败: ' + e.message, 'error');
    }
}

async function testConnection() {
    var btn = document.getElementById('btn-test');
    var origText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 测试中...';
    renderStatus('warning', '⏳ 正在测试连接...');

    var payload = {
        base_url: getVal('base_url'),
        model: getVal('model'),
    };
    // 掩码值不回传，由后端读取已保存的 key 进行测试
    var key = getVal('api_key');
    if (key && key.indexOf('****') === -1) {
        payload.api_key = key;
    }
    try {
        var r = await fetch('/api/settings/test', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        var d = await r.json();
        if (d.ok) {
            showToast('✅ 连接成功！' + (d.model || ''), 'success');
            renderStatus('success', '连接成功 · ' + (d.model || ''));
        } else {
            showToast('❌ 连接失败: ' + (d.error || '未知错误'), 'error');
            renderStatus('error', '连接失败: ' + (d.error || '未知错误'));
        }
    } catch(e) {
        showToast('❌ 请求失败: ' + e.message, 'error');
        renderStatus('error', '请求失败: ' + e.message);
    }
    btn.disabled = false;
    btn.innerHTML = origText;
}
</script>
{% endblock %}
