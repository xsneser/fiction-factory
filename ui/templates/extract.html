{% extends "base.html" %}
{% block title %}内容提取 — NovelEngine{% endblock %}
{% block content %}
<h1>📝 内容提取</h1>
<p style="font-size:13px;color:#8b949e;margin-bottom:20px">从已下载的小说中提取资产库条目和写作风格</p>

<div class="tabs" style="margin-bottom:20px">
    <a href="javascript:;" class="extract-tab active" data-tab="library" onclick="switchExtractTab('library')">🗂️ 资产库提取</a>
    <a href="javascript:;" class="extract-tab" data-tab="style" onclick="switchExtractTab('style')">✍️ 写作风格提取</a>
</div>

{# ─── 资产库提取 ─── #}
<div id="extract-library" class="extract-panel">
    <p style="font-size:13px;color:#8b949e;margin-bottom:12px">选中已下载的小说，分析并提取桥段/大纲/笑点/内涵到四大库</p>
    <div id="library-novels-list"></div>
</div>

{# ─── 写作风格提取 ─── #}
<div id="extract-style" class="extract-panel" style="display:none">
    <p style="font-size:13px;color:#8b949e;margin-bottom:12px">分析已下载小说的写作风格，生成风格摘要并可关联到笔名档案</p>
    <div id="style-novels-list"></div>
</div>

<div id="extract-result-area" style="display:none;margin-top:20px"></div>

<style>
.style-result { background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px }
.style-result h3 { color:#58a6ff;margin-bottom:12px }
.style-result .field { margin-bottom:10px }
.style-result .field-label { font-size:12px;color:#8b949e }
.style-result .field-value { font-size:14px;margin-top:2px }
</style>

<script src="/static/js/library_review.js"></script>
<script>
// 单工具互斥代际计数器：新分析任务替代旧任务后，旧请求的返回结果被丢弃
var _extractGen = 0;

function switchExtractTab(key) {
    document.querySelectorAll('.extract-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.extract-panel').forEach(function(p) { p.style.display = 'none'; });
    var tab = document.querySelector('.extract-tab[data-tab="' + key + '"]');
    if (tab) tab.classList.add('active');
    var panel = document.getElementById('extract-' + key);
    if (panel) panel.style.display = 'block';
    if (key === 'library') loadNovelsForExtract('library');
    if (key === 'style') loadNovelsForExtract('style');
}

function loadNovelsForExtract(mode) {
    var el = document.getElementById(mode === 'library' ? 'library-novels-list' : 'style-novels-list');
    el.innerHTML = '<div class="empty"><p style="color:#484f58">加载中...</p></div>';

    fetch('/api/scout/novels')
        .then(function(r) { return r.json(); })
        .then(function(novels) {
            if (!novels || novels.length === 0) {
                el.innerHTML = '<div class="empty" style="padding:40px"><div class="icon" style="font-size:36px">📂</div><p style="color:#8b949e;margin-top:12px">暂无已下载的小说</p><p style="color:#484f58;font-size:12px;margin-top:6px">先去「小说抓取」下载几本</p></div>';
                return;
            }
            var html = '';
            novels.forEach(function(n) {
                html += '<div class="card" style="margin-bottom:12px">';
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<div><strong>' + n.title + '</strong> <span class="tag">' + (n.author||'') + '</span></div>';
                html += '<span style="font-size:12px;color:#8b949e">' + (n.saved_chapters||0) + '/' + (n.chapter_count||'?') + '章</span>';
                html += '</div>';
                html += '<p style="font-size:12px;color:#484f58;margin-top:6px">平台: ' + (n.platform||'') + ' · 收录: ' + (n.downloaded_at||'') + '</p>';
                html += '<div style="margin-top:8px;display:flex;gap:8px">';

                var p = n.platform, f = n.folder;
                if (mode === 'library') {
                    if (n.analyzed) {
                        html += '<span class="tag green">✅ 已提取</span>';
                        html += '<button class="small lib-btn" data-p="' + p + '" data-f="' + f + '">🔄 重新提取</button>';
                    } else {
                        html += '<button class="small lib-btn" data-p="' + p + '" data-f="' + f + '" style="background:#238636">🗂️ 提取资产库</button>';
                    }
                } else {
                    if (n.analyzed) {
                        html += '<span class="tag green">✅ 已分析</span>';
                    }
                    html += '<button class="small style-btn" data-p="' + p + '" data-f="' + f + '" style="background:#1f6feb">✍️ 分析写作风格</button>';
                }

                html += '</div></div>';
            });
            el.innerHTML = html;
        });
}

function extractLibrary(platform, folder, btn) {
    // 单工具互斥：新任务替代旧任务，旧请求返回后不再渲染
    var gen = ++_extractGen;
    btn.disabled = true;
    btn.textContent = '提取中...';
    document.getElementById('extract-result-area').style.display = 'none';
    readAnalyzeStream(gen, btn, '🗂️ 提取资产库', platform, folder, 'library');
}

function extractStyle(platform, folder, btn) {
    // 单工具互斥：新任务替代旧任务，旧请求返回后不再渲染
    var gen = ++_extractGen;
    btn.disabled = true;
    btn.textContent = '分析中...';
    document.getElementById('extract-result-area').style.display = 'none';
    readAnalyzeStream(gen, btn, '✍️ 分析写作风格', platform, folder, 'style');
}

// SSE 读取分析流：进度日志由后端 task_manager 驱动右侧状态栏，
// 前端只等 done 事件渲染结果卡片
function readAnalyzeStream(gen, btn, btnText, platform, folder, mode) {
    fetch('/api/scout/analyze', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({platform: platform, folder: folder, mode: mode}),
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || ('HTTP ' + r.status)); });
        var reader = r.body.getReader();
        var decoder = new TextDecoder();
        function read() {
            return reader.read().then(function(res) {
                if (res.done) return;
                var raw = decoder.decode(res.value, {stream: true});
                var lines = raw.split('\n');
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (line.startsWith('data: ')) {
                        try {
                            var d = JSON.parse(line.slice(6));
                            if (d.event === 'done') {
                                if (gen === _extractGen) {
                                    if (mode === 'library') showReviewCards(d);
                                    else showStyleResult(d);
                                }
                                return;
                            }
                            if (d.event === 'error') {
                                if (gen === _extractGen) alert('❌ 分析失败: ' + (d.message||'未知错误'));
                                return;
                            }
                            if (d.event === 'cancelled') {
                                // 被新任务替代，静默结束
                                return;
                            }
                        } catch(e) {}
                    }
                }
                return read();
            });
        }
        return read();
    })
    .catch(function(e) { if (gen === _extractGen) alert('❌ 请求失败: ' + e.message); })
    .finally(function() { if (gen === _extractGen) { btn.disabled = false; btn.textContent = btnText; } });
}

function showAlert(msg, type) {
    // 不再使用右上角绿色弹框，日志统一走右侧状态栏（task_manager）
}

// ─── 审核入库（复用scout的逻辑） ───

var _lastReviewData = null;
var EXTRACT_RESULT_KEY = 'novelengine_extract_result';

function showReviewCards(d) {
    _lastReviewData = d;
    // 持久化结果到 sessionStorage：切换页面后回来仍能查看
    try { sessionStorage.setItem(EXTRACT_RESULT_KEY, JSON.stringify({mode:'library', data:d})); } catch(e) {}
    renderReviewCards(d, 'extract-result-area');
    var area = document.getElementById('extract-result-area');
    area.scrollIntoView({behavior:'smooth', block:'start'});
}

function showStyleResult(d) {
    // 持久化结果到 sessionStorage：切换页面后回来仍能查看
    try { sessionStorage.setItem(EXTRACT_RESULT_KEY, JSON.stringify({mode:'style', data:d})); } catch(e) {}
    renderStyleResult(d);
    var area = document.getElementById('extract-result-area');
    area.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderStyleResult(d) {
    var area = document.getElementById('extract-result-area');
    area.style.display = 'block';
    var s = d.writing_style || {};
    var html = '<div class="style-result">';
    html += '<h3>✍️ ' + d.title + ' — 写作风格分析</h3>';
    html += '<div class="field"><div class="field-label">📝 风格概要</div><div class="field-value">' + (s.summary || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">句子节奏</div><div class="field-value">' + (s.sentence_rhythm || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">对话风格</div><div class="field-value">' + (s.dialogue_style || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">描写偏好</div><div class="field-value">' + (s.description_focus || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">情绪表达</div><div class="field-value">' + (s.emotional_expression || '') + '</div></div>';
    if (s.common_words && s.common_words.length) html += '<div class="field"><div class="field-label">常用词</div><div class="field-value">' + s.common_words.join('、') + '</div></div>';
    if (s.avoid_words && s.avoid_words.length) html += '<div class="field"><div class="field-label">禁用词</div><div class="field-value">' + s.avoid_words.join('、') + '</div></div>';
    html += '<div class="field"><div class="field-label">叙事视角</div><div class="field-value">' + (s.narrative_perspective || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">开篇风格</div><div class="field-value">' + (s.opening_style || '') + '</div></div>';
    html += '<div class="field"><div class="field-label">节奏把控</div><div class="field-value">' + (s.pacing || '') + '</div></div>';
    html += '</div>';
    area.innerHTML = html;
}

</script>
{% endblock %}
