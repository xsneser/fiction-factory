{% extends "base.html" %}
{% block content %}
<h1>✍️ 写作台</h1>

<p style="color:#8b949e;margin-bottom:20px">选择桥段模板 → 填充变量 → 生成 prompt → 预览</p>

<form id="write-form">
    <h3>1️⃣ 选择桥段</h3>
    <div class="form-row">
        <div class="form-group"><label>桥段模板</label>
            <select name="plot_id" id="plot-select">
                <option value="">-- 选择一个模板 --</option>
                {% for p in plots %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.category }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>笔名档案</label>
            <select name="profile_id">
                <option value="">-- 选择笔名 --</option>
                {% for p in profiles %}
                <option value="{{ p.id }}">{{ p.pen_name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div id="plot-slots" style="margin:12px 0"></div>

    <h3>2️⃣ 章节信息</h3>
    <div class="form-row-3">
        <div class="form-group"><label>章节号</label><input type="number" name="chapter_num" value="1" min="1"></div>
        <div class="form-group"><label>目标字数</label><input type="number" name="target_words" value="3000"></div>
        <div class="form-group"><label>变体</label>
            <select name="variant"><option value="">标准版</option><option>严肃版</option><option>幽默版</option></select>
        </div>
    </div>
    <div class="form-group"><label>本章大纲</label><textarea name="chapter_outline" placeholder="描述本章要发生的事..."></textarea></div>

    <button type="button" onclick="preview()" style="font-size:15px;padding:12px 24px">👁️ 预览 Prompt</button>
</form>

<div id="preview-area" style="margin-top:24px;display:none">
    <h3>📋 生成预览</h3>
    <div id="meta-info" style="margin-bottom:12px"></div>
    <div class="accordion"><div class="accordion-header">System Prompt</div><div class="accordion-body"><pre id="system-preview"></pre></div></div>
    <div class="accordion"><div class="accordion-header show">User Prompt</div><div class="accordion-body show"><pre id="user-preview"></pre></div></div>
</div>

<script>
const PLOT_DATA = {};
{% for p in plots %}
PLOT_DATA["{{ p.id }}"] = {
    name: "{{ p.name }}",
    slots: {{ p.slots|tojson }},
    template_structure: "{{ p.template_structure }}"
};
{% endfor %}

document.getElementById('plot-select').addEventListener('change', function() {
    const plot = PLOT_DATA[this.value];
    const div = document.getElementById('plot-slots');
    div.innerHTML = '';
    if (!plot || !plot.slots) return;
    div.innerHTML = '<h3>变量填充</h3>' + plot.slots.map((s,i) =>
        '<div class="form-group"><label>'+s.name+' <small style="color:#8b949e">('+s.description+')</small></label>'+
        '<input name="var_'+i+'" placeholder="可选: '+s.options.join(' / ')+'"></div>'
    ).join('');
});

async function preview() {
    const f = document.getElementById('write-form');
    const fd = new FormData(f);
    const body = {
        plot_id: fd.get('plot_id'),
        profile_id: fd.get('profile_id'),
        chapter_num: parseInt(fd.get('chapter_num')) || 1,
        chapter_outline: fd.get('chapter_outline') || '',
        target_words: parseInt(fd.get('target_words')) || 3000,
        variables: {}
    };
    // 收集变量
    const slots = document.getElementById('plot-slots').querySelectorAll('input');
    const plot = PLOT_DATA[body.plot_id];
    if (plot && plot.slots) {
        slots.forEach((inp,i) => {
            if (inp.value && plot.slots[i]) body.variables[plot.slots[i].name] = inp.value;
        });
    }

    const r = await fetch('/api/write/preview', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data = await r.json();

    document.getElementById('preview-area').style.display = 'block';
    document.getElementById('meta-info').innerHTML =
        '<span class="tag green">'+data.plot_name+'</span> '+
        (data.gags||[]).map(g=>'<span class="tag blue">'+g+'</span>').join(' ')+' '+
        (data.themes||[]).map(t=>'<span class="tag yellow">'+t+'</span>').join(' ');
    document.getElementById('system-preview').textContent = data.system;
    document.getElementById('user-preview').textContent = data.user;
}
</script>
{% endblock %}
