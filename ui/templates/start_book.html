{% extends "base.html" %}
{% block title %}启动新书 — NovelEngine{% endblock %}
{% block content %}
<h1>🔰 启动新书</h1>
<p class="subtitle">填写基本信息即可开始，引擎会自动完成规划、前三章和书名生成。</p>

<form method="POST" class="form-grid">
    <fieldset>
        <legend>📖 基本信息</legend>
        <div class="form-row">
            <label>书名（可先留空，引擎会生成）</label>
            <input name="title" placeholder="书名（可选）" value="{{ request.form.get('title','') }}">
        </div>
        <div class="form-row">
            <label>笔名</label>
            <select name="pen_name" required>
                <option value="">选择笔名...</option>
                {% for p in pen_names %}
                <option value="{{ p.pen_name }}" {% if request.form.get('pen_name')==p.pen_name %}selected{% endif %}>{{ p.pen_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row half">
            <label>流派</label>
            <select name="genre" required>
                <option value="">选择...</option>
                <option value="玄幻" {% if request.form.get('genre')=='玄幻' %}selected{% endif %}>玄幻</option>
                <option value="都市" {% if request.form.get('genre')=='都市' %}selected{% endif %}>都市</option>
                <option value="言情" {% if request.form.get('genre')=='言情' %}selected{% endif %}>言情</option>
                <option value="悬疑" {% if request.form.get('genre')=='悬疑' %}selected{% endif %}>悬疑</option>
                <option value="穿越" {% if request.form.get('genre')=='穿越' %}selected{% endif %}>穿越</option>
                <option value="科幻" {% if request.form.get('genre')=='科幻' %}selected{% endif %}>科幻</option>
            </select>
            <label>子类型</label>
            <input name="sub_genre" placeholder="如：系统流、重生、逆袭" value="{{ request.form.get('sub_genre','') }}">
        </div>
        <div class="form-row half">
            <label>目标平台</label>
            <select name="platform">
                <option value="fanqie" {% if request.form.get('platform')=='fanqie' %}selected{% endif %}>番茄小说</option>
                <option value="qidian" {% if request.form.get('platform')=='qidian' %}selected{% endif %}>起点中文网</option>
            </select>
            <label>每章字数</label>
            <input name="words_per_chapter" type="number" value="{{ request.form.get('words_per_chapter', 3000) }}" min="1000" max="10000" step="500">
        </div>
        <div class="form-row">
            <label>时间线描述（可选，留空由引擎自动设划）</label>
            <textarea name="timeline_hint" rows="2" placeholder="如：开头都市爽文30章，穿越到异界接系统升级流...">{{ request.form.get('timeline_hint','') }}</textarea>
        </div>
    </fieldset>

    <fieldset>
        <legend>🧑 主角设定（可选）</legend>
        <div class="form-row half">
            <label>主角姓名</label>
            <input name="protag_name" placeholder="留空由 AI 生成" value="{{ request.form.get('protag_name','') }}">
            <label>身份/职业</label>
            <input name="protag_identity" placeholder="如：废柴家族少主、程序员" value="{{ request.form.get('protag_identity','') }}">
        </div>
        <div class="form-row half">
            <label>性格特点</label>
            <input name="protag_personality" placeholder="如：幽默自嘲、冷酷理性" value="{{ request.form.get('protag_personality','') }}">
            <label>金手指类型</label>
            <input name="protag_golden_finger" placeholder="如：草民系统、血脉觉醒" value="{{ request.form.get('protag_golden_finger','') }}">
        </div>
    </fieldset>

    <fieldset>
        <legend>🌍 世界观（可选）</legend>
        <div class="form-row">
            <label>世界观简述</label>
            <textarea name="world_desc" rows="2" placeholder="如：灵气复苏后科技与修仙共存、异界大陆七国争霸...">{{ request.form.get('world_desc','') }}</textarea>
        </div>
    </fieldset>

    <fieldset>
        <legend>📐 模板选择（可选，留空由引擎自动匹配）</legend>
        <div class="form-row">
            <label>开篇桥段</label>
            <select name="opening_template_id">
                <option value="">自动匹配</option>
                {% for t in openings %}
                <option value="{{ t.id }}">{{ t.name }} — {{ t.description[:40] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label>金手指桥段</label>
            <select name="golden_finger_template_id">
                <option value="">自动匹配</option>
                {% for t in golden_fingers %}
                <option value="{{ t.id }}">{{ t.name }} — {{ t.description[:40] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label>大纲结构</label>
            <select name="structure_template_id">
                <option value="">自动匹配</option>
                {% for s in structures %}
                <option value="{{ s.id }}">{{ s.name }} ({{ s.total_chapters }}章)</option>
                {% endfor %}
            </select>
        </div>
    </fieldset>

    <button type="submit" class="btn-primary">🚀 启动新书</button>
</form>

<style>
.subtitle { color:#8b949e; margin-bottom:24px; }
.form-grid { max-width:800px; }
fieldset { border:1px solid #30363d; border-radius:8px; padding:20px; margin-bottom:20px; }
legend { color:#58a6ff; font-weight:600; padding:0 8px; }
.form-row { margin-bottom:14px; }
.form-row label { display:block; color:#c9d1d9; font-size:13px; margin-bottom:4px; }
.form-row input, .form-row select { width:100%; background:#0d1117; border:1px solid #30363d; color:#f0f6fc; padding:8px 12px; border-radius:6px; font-size:14px; }
.form-row input:focus, .form-row select:focus { border-color:#58a6ff; outline:none; }
.form-row.half { display:flex; gap:12px; }
.form-row.half > * { flex:1; }
.form-row.half label { display:block; }
.form-row.half input, .form-row.half select { width:100%; }
.btn-primary { background:#238636; color:white; border:none; padding:12px 32px; border-radius:8px; font-size:16px; cursor:pointer; transition:all .2s; }
.btn-primary:hover { background:#2ea043; }
</style>
{% endblock %}
