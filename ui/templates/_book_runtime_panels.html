{# ─── 书详情运行时面板：**只剩角色状态** ───
   原有的四个运行时面板（决策中心 / 承诺台账 / 诊断 / 快照留痕）已删除：它们是 agent 决策与排障
   视图，人不需要看。底层能力一个没动——承诺扫描 / 各项诊断 / 章质量门禁 / 快照留底仍被 agent 工具
   与收章链路使用，只是不再有书详情页的浏览器入口。
   依赖：包含页已定义 window.BOOK_ID；手风琴复用全局 .accordion-header 委托。 ── #}

<div class="accordion runtime-character-panel">
    <div class="accordion-header" aria-expanded="true">🎭 角色状态 <span class="sl-chev">▾</span></div>
    <div class="accordion-body show">
        <div id="rp-char-states"><div class="empty">加载中…</div></div>
    </div>
</div>

<script>
function _rp_esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 事件台账 type → 展示名（与 character_state._EVENT_FIELD 对齐） */
var _CS_EVENT_ZH = {goal_shift:'🎯 目标', power_shift:'⚡ 实力', location_shift:'📍 位置',
                    arc_stage:'🌀 弧线', relationship:'🤝 关系', trust_change:'🔗 信任', note:'📝 备注'};

/* 状态行只放**真的会变、且真的被写过**的字段。
   刻意不显示 mood：它只在注册时被设成「正常」，`_ALLOWED_EVENT_TYPES` 里没有任何事件能更新它
   ——渲染它等于固定输出一句噪音。也不显示推断字段（矛盾/秘密/压力），它们当前无自动推断实现，
   且 secret 会剧透，统一收进折叠区。 */
function _csChips(c) {
    var out = [];
    ['power_level', 'arc_stage', 'relationship_to_mc'].forEach(function (k) {
        if (c[k]) out.push('<span class="character-state-chip">' + _rp_esc(c[k]) + '</span>');
    });
    return out.length ? out.join('') : '<span class="wf-context-empty">未记录</span>';
}
function _csInferred(c) {
    var out = [];
    if (c.conflict) out.push('⚔️ 矛盾 ' + _rp_esc(c.conflict));
    if (c.secret) out.push('🫥 秘密 ' + _rp_esc(c.secret));
    if (c.emotional_pressure) out.push('🌡 压力 ' + _rp_esc(c.emotional_pressure));
    if (!out.length) return '';
    return '<details class="character-inference"><summary>矛盾与压力</summary>'
        + '<div class="character-inference-body">' + out.join(' · ') + '</div></details>';
}
function _csEvents(c) {
    var evs = (c.events || []).slice().reverse();      // 最新在前
    if (!evs.length) return '';
    var rows = evs.map(function (e) {
        var line = '<span class="ce-chapter">第' + _rp_esc(e.chapter || '?') + '章</span>'
            + '<span class="character-event-tag">' + _rp_esc(_CS_EVENT_ZH[e.type] || e.type || '事件') + '</span>';
        if (e.from && e.to) line += _rp_esc(e.from) + ' → <b>' + _rp_esc(e.to) + '</b>';
        else if (e.to) line += '→ <b>' + _rp_esc(e.to) + '</b>';
        else if (e.from) line += _rp_esc(e.from) + ' →';
        if (e.reason) line += ' <span class="character-action-reason">— ' + _rp_esc(e.reason) + '</span>';
        return '<div class="character-event-row">' + line + '</div>';
    }).join('');
    return '<details class="character-events"><summary>人物变化事件 ' + evs.length + ' 条</summary>'
        + '<div style="margin-top:4px">' + rows + '</div></details>';
}

/* 角色卡：位置 / 状态 / 动作 三行。**没有数据就写「未记录 / 暂无明确行动」，绝不从人设推断。**
   数据模型里没有 action 字段，所以「动作」= goal（当前目标，agent 可经 goal_shift 上报）
   + 最近一条章内变化事件；两者都空时如实说没有。 */
function _csCard(c) {
    var events = (c.events || []);
    var last = events.length ? events[events.length - 1] : null;
    var action = c.goal ? _rp_esc(c.goal) : '';
    if (last && last.to) {
        action += (action ? ' · ' : '') + _rp_esc(last.to);
        if (last.reason) action += ' <span class="character-action-reason">' + _rp_esc(last.reason) + '</span>';
    }
    var badges = [];
    if (c.is_protagonist) badges.push('<span>主角</span>');
    if (c.appears_in_current_chapter) badges.push('<span>本章出场</span>');
    var offline = Number(c.offline_chapters || 0);
    return '<article class="character-state-card">'
        + '<header class="character-state-head"><div><strong>' + _rp_esc(c.name) + '</strong>'
        + (c.identity ? '<span class="character-identity">' + _rp_esc(c.identity) + '</span>' : '') + '</div>'
        + '<div class="character-badges">' + badges.join('') + '</div></header>'
        + '<dl class="character-state-lines">'
        + '<div><dt>位置</dt><dd>' + (c.location ? _rp_esc(c.location) : '<span class="wf-context-empty">未记录</span>')
        + (offline > 50 ? ' <span class="character-badges"><span>离线 ' + offline + ' 章</span></span>' : '') + '</dd></div>'
        + '<div><dt>状态</dt><dd>' + _csChips(c) + '</dd></div>'
        + '<div><dt>动作</dt><dd>' + (action || '<span class="wf-context-empty">暂无明确行动</span>') + '</dd></div>'
        + '</dl>' + _csInferred(c) + _csEvents(c) + '</article>';
}

(function () {
    var BOOK = window.BOOK_ID;
    if (!BOOK) return;
    fetch('/api/book/' + encodeURIComponent(BOOK) + '/character-states')
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var el = document.getElementById('rp-char-states');
            if (!el) return;
            var cs = (d && d.characters) || [];
            if (!cs.length) {
                el.innerHTML = '<div class="empty">还没有角色状态（完成首章后生成）</div>';
                return;
            }
            /* 主角 → 本章出场 → 其余折叠。判定由后端给（role/is_protagonist/appears_in_current_chapter
               都来自静态人物设定与状态机），浏览器不猜谁是主角。 */
            var main = cs.filter(function (c) { return c.is_protagonist || c.appears_in_current_chapter; });
            var others = cs.filter(function (c) { return !(c.is_protagonist || c.appears_in_current_chapter); });
            var html = main.map(_csCard).join('');
            if (others.length) {
                html += '<details class="character-other-group"><summary>其他角色 ' + others.length + ' 人</summary>'
                    + others.map(_csCard).join('') + '</details>';
            }
            el.innerHTML = html;
        })
        .catch(function () {
            var el = document.getElementById('rp-char-states');
            if (el) el.innerHTML = '<div class="empty">角色状态加载失败，请刷新重试</div>';
        });
})();
</script>
