<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelEngine — 小说工厂</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background:#0f1117; color:#e1e4e8; display:flex; min-height:100vh; overflow:hidden; }
        /* Sidebar */
        nav { width:220px; background:#161b22; padding:20px 0; border-right:1px solid #30363d; flex-shrink:0; }
        nav .logo { padding:0 20px 20px; font-size:20px; font-weight:bold; color:#58a6ff; border-bottom:1px solid #30363d; margin-bottom:10px; }
        nav a { display:block; padding:10px 20px; color:#8b949e; text-decoration:none; font-size:14px; transition:all .2s; }
        nav a:hover, nav a.active { color:#f0f6fc; background:#1f2937; }
        nav .section { padding:12px 20px 4px; color:#484f58; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
        /* Main */
        .main-wrapper { flex:1; display:flex; overflow:hidden; }
        main { flex:1; padding:30px; overflow-y:auto; }
        /* Right sidebar - 运行状态 */
        aside#status-bar {
            width: 260px; background:#161b22; border-left:1px solid #30363d;
            padding: 16px; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; gap:10px;
        }
        aside#status-bar .status-title { font-size:12px; color:#484f58; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        aside#status-bar .status-empty { font-size:12px; color:#484f58; text-align:center; padding:20px 0; }
        aside#status-bar .status-card {
            background:#0d1117; border:1px solid #21262d; border-radius:6px;
            padding:10px 12px; font-size:12px;
        }
        aside#status-bar .status-card .task-name { color:#c9d1d9; font-weight:500; }
        aside#status-bar .status-card .task-phase { color:#8b949e; font-size:11px; margin-top:2px; }
        aside#status-bar .status-card .task-progress { margin-top:6px; height:4px; background:#21262d; border-radius:2px; overflow:hidden; }
        aside#status-bar .status-card .task-progress-fill { height:100%; background:#238636; border-radius:2px; transition:width .3s; }
        aside#status-bar .status-card .task-time { color:#484f58; font-size:10px; margin-top:4px; }
        h1 { font-size:24px; margin-bottom:20px; color:#f0f6fc; }
        h2 { font-size:18px; margin:20px 0 12px; color:#c9d1d9; }
        h3 { font-size:15px; margin:12px 0 8px; color:#8b949e; }
        /* Cards */
        .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-bottom:24px; }
        .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:20px; transition:all .2s; }
        .card:hover { border-color:#58a6ff; }
        .card .title { font-size:16px; font-weight:600; color:#58a6ff; margin-bottom:8px; }
        .card .meta { font-size:12px; color:#8b949e; margin-bottom:6px; }
        .card .stat { font-size:32px; font-weight:bold; color:#f0f6fc; }
        .card .label { font-size:11px; color:#8b949e; }
        /* Tables */
        table { width:100%; border-collapse:collapse; margin:12px 0; }
        th, td { padding:10px 14px; text-align:left; border-bottom:1px solid #30363d; font-size:13px; }
        th { color:#8b949e; font-weight:500; background:#0d1117; }
        tr:hover td { background:#161b22; }
        /* Forms */
        form { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:20px; margin-bottom:20px; }
        .form-group { margin-bottom:14px; }
        label { display:block; margin-bottom:4px; font-size:13px; color:#c9d1d9; font-weight:500; }
        input, select, textarea { width:100%; padding:8px 12px; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#f0f6fc; font-size:13px; font-family:inherit; }
        input:focus, select:focus, textarea:focus { border-color:#58a6ff; outline:none; }
        textarea { min-height:80px; resize:vertical; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
        /* Buttons */
        button, .btn { padding:8px 16px; background:#238636; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:all .2s; }
        button:hover { background:#2ea043; }
        .btn-primary { background:#238636; color:white; border:none; padding:10px 24px; border-radius:8px; font-size:14px; cursor:pointer; }
        button.secondary { background:#30363d; }
        button.danger { background:#da3633; }
        button.small { padding:4px 10px; font-size:12px; }
        a.btn { text-decoration:none; display:inline-block; }
        /* Tags */
        .tag { display:inline-block; padding:2px 8px; background:#1f2937; border-radius:12px; font-size:11px; color:#8b949e; margin:2px; }
        .tag.green { background:#0d3322; color:#3fb950; }
        .tag.blue { background:#0d1d33; color:#58a6ff; }
        .tag.yellow { background:#332b0d; color:#d29922; }
        .tag.red { background:#330d0d; color:#f85149; }
        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid #30363d; }
        .tabs a { padding:8px 16px; color:#8b949e; text-decoration:none; font-size:13px; border-bottom:2px solid transparent; }
        .tabs a.active, .tabs a:hover { color:#f0f6fc; border-bottom-color:#58a6ff; }
        /* Alerts */
        .alert { padding:12px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; }
        .alert.success { background:#0d3322; border:1px solid #238636; color:#3fb950; }
        .alert.warning { background:#332b0d; border:1px solid #d29922; color:#d29922; }
        .alert.error { background:#330d0d; border:1px solid #da3633; color:#f85149; }
        .alert.info { background:#0d1d33; border:1px solid #1f6feb; color:#58a6ff; }
        /* Code */
        pre { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:16px; overflow-x:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }
        code { font-family:'Fira Code', monospace; }
        /* Empty state */
        .empty { text-align:center; padding:60px 20px; color:#484f58; }
        .empty .icon { font-size:48px; margin-bottom:12px; }
        /* Detail grid */
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .detail-item { background:#161b22; padding:16px; border-radius:6px; border:1px solid #30363d; }
        .detail-item .label { font-size:11px; color:#8b949e; }
        .detail-item .value { font-size:18px; font-weight:bold; margin-top:4px; }
        /* Progress */
        .progress-bar { height:8px; background:#30363d; border-radius:4px; overflow:hidden; margin:8px 0; }
        .progress-fill { height:100%; background:#238636; border-radius:4px; transition:width .3s; }
        /* Accordion */
        .accordion { background:#161b22; border:1px solid #30363d; border-radius:8px; margin-bottom:8px; }
        .accordion-header { padding:12px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
        .accordion-header:hover { background:#1f2937; }
        .accordion-body { padding:0 16px 16px; display:none; }
        .accordion-body.show { display:block; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">📖 NovelEngine</div>
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">🏠 仪表盘</a>
        <div class="section">创作</div>
        <a href="/books/start" class="{{ 'active' if request.path == '/books/start' else '' }}">🔰 启动新书</a>
        <a href="/books" class="{{ 'active' if request.path == '/books' else '' }}">📚 书库</a>
        <div class="section">资产库</div>
        <a href="/plots" class="{{ 'active' if request.path == '/plots' else '' }}">🧩 桥段库</a>
        <a href="/structures" class="{{ 'active' if request.path == '/structures' else '' }}">📋 大纲库</a>
        <a href="/gags" class="{{ 'active' if request.path == '/gags' else '' }}">😂 笑点库</a>
        <a href="/themes" class="{{ 'active' if request.path == '/themes' else '' }}">💡 内涵库</a>
        <div class="section">管理</div>
        <a href="/profiles" class="{{ 'active' if request.path.startswith('/profiles') else '' }}">👤 笔名档案</a>
        <a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}">⚙️ 设置</a>
        <div class="section">工具</div>
        <a href="/scout" class="{{ 'active' if request.path == '/scout' else '' }}">🔍 小说抓取</a>
        <a href="/extract" class="{{ 'active' if request.path == '/extract' else '' }}">📝 内容提取</a>
        <a href="/deai" class="{{ 'active' if request.path == '/deai' else '' }}">🔄 去AI测试</a>
        <a href="/review-test" class="{{ 'active' if request.path == '/review-test' else '' }}">🔍 审查测试</a>
    </nav>
    <div class="main-wrapper">
        <main>
            {% block content %}{% endblock %}
        </main>
        <aside id="status-bar">
            <div class="status-title">⏳ 运行状态</div>
            <div id="current-task" style="display:none"></div>
            <div id="task-log" style="display:none">
                <div class="status-title" style="margin-top:8px">📋 日志</div>
                <div id="task-log-list" style="font-size:11px;line-height:1.6"></div>
            </div>
            <div id="status-tasks"></div>
        </aside>
    </div>
    <script>
        // Accordion toggle
        document.querySelectorAll('.accordion-header').forEach(h => {
            h.addEventListener('click', () => {
                const body = h.nextElementSibling;
                body.classList.toggle('show');
            });
        });

        // 运行状态轮询（仅更新进度/日志，不重建整块DOM防闪烁）
        var prevLogCount = {};
        var prevTaskHtml = '';
        function pollStatus() {
            fetch('/api/status/tasks')
                .then(function(r) { return r.json(); })
                .then(function(tasks) {
                    var el = document.getElementById('status-tasks');
                    var logArea = document.getElementById('task-log');
                    var logList = document.getElementById('task-log-list');

                    var html;
                    if (!tasks || tasks.length === 0) {
                        html = '<div class="status-empty">暂无运行中的任务</div>';
                        if (logArea) logArea.style.display = 'none';
                    } else {
                        var t = tasks[0];
                        var pct = t.total > 0 ? Math.round((t.current/t.total)*100) : 0;
                        html = '<div class="status-card">';
                        html += '<div class="task-name">' + (t.title || t.name) + '</div>';
                        html += '<div class="task-phase">' + (t.phase||'') + '</div>';
                        if (t.total > 0) html += '<div class="task-progress"><div class="task-progress-fill" style="width:' + pct + '%"></div></div>';
                        if (t.time) html += '<div class="task-time">' + t.time + '</div>';
                        html += '</div>';
                        // 日志增量追加
                        if (logArea && t.logs && t.logs.length > 0) {
                            logArea.style.display = 'block';
                            var prev = prevLogCount[t.id] || 0;
                            if (t.logs.length > prev) {
                                for (var i = prev; i < t.logs.length; i++) {
                                    var l = t.logs[i];
                                    var div = document.createElement('div');
                                    div.style.cssText = 'padding:2px 0;border-left:2px solid ' + (l.level==='error'?'#f85149':l.level==='success'?'#3fb950':'#30363d') + ';padding-left:6px;margin:1px 0;font-size:11px';
                                    div.textContent = l.time + ' ' + l.message;
                                    logList.appendChild(div);
                                }
                                logList.scrollTop = logList.scrollHeight;
                            }
                            prevLogCount[t.id] = t.logs.length;
                        }
                    }
                    // 只在变化时替换
                    if (html !== prevTaskHtml) {
                        el.innerHTML = html;
                        prevTaskHtml = html;
                    }
                }).catch(function() {});
        }
        pollStatus();
        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
