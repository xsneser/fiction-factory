{% extends "base.html" %}
{% block title %}外部书库 — NovelEngine{% endblock %}
{% block content %}
<h1>📚 外部书库</h1>

<div style="display:flex;justify-content:flex-end;gap:8px;margin:16px 0">
    <a class="btn" href="/scout" style="text-decoration:none">🔍 去侦察/抓取新书</a>
    <button class="btn" onclick="loadNovels()">🔄 刷新</button>
</div>

<div id="novels-list" style="margin-top:8px">
    <div class="empty"><p style="color:#484f58">加载中...</p></div>
</div>

<style>
.novel-actions { display:flex;gap:8px;align-items:center;margin-top:8px; }
</style>

<script>
(function(){ loadNovels(); })();

function loadNovels() {
    var el = document.getElementById('novels-list');
    fetch('/api/scout/novels')
        .then(function(r) { return r.json(); })
        .then(function(novels) {
            if (!novels || novels.length === 0) {
                el.innerHTML = '<div class="empty" style="padding:40px"><div class="icon" style="font-size:36px">📂</div>'
                    + '<p style="color:#8b949e;margin-top:12px">暂无已下载的小说</p>'
                    + '<p style="color:#484f58;font-size:12px;margin-top:6px">去 <a href="/scout">步骤一·侦察抓取</a> 页下载一本书，再到 <a href="/extract">步骤二·提取入库</a> 提炼素材</p></div>';
                return;
            }
            var html = '';
            novels.forEach(function(n) {
                var p = n.platform || 'fanqie';
                html += '<div class="card" style="margin-bottom:12px">';
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<div><strong>' + escapeHtml(n.title) + '</strong> <span class="tag">' + escapeHtml(n.author||'') + '</span></div>';
                html += '<span style="font-size:12px;color:#8b949e">已下载 ' + (n.saved_chapters||0) + ' 章</span>';
                html += '</div>';
                html += '<p style="font-size:12px;color:#484f58;margin-top:6px">平台: ' + escapeHtml(p) + ' · 收录: ' + escapeHtml(n.downloaded_at||'') + '</p>';
                html += '<div class="novel-actions">';
                html += '<button class="small" style="background:#238636" data-p="' + escapeHtml(p) + '" data-f="' + escapeHtml(n.folder) + '" onclick="readFrom(this)">📖 阅读</button>';
                html += '<button class="small" style="background:#1f6feb" data-t="' + escapeHtml(n.title) + '" data-f="' + escapeHtml(n.folder) + '" data-p="' + escapeHtml(p) + '" onclick="goExtractFrom(this)">🧪 去提取页分析</button>';
                html += '<button class="small" style="background:#21262d;color:#f85149" data-p="' + escapeHtml(p) + '" data-f="' + escapeHtml(n.folder) + '" onclick="deleteFrom(this)">🗑 删除</button>';
                html += '</div></div>';
            });
            el.innerHTML = html;
        })
        .catch(function() { el.innerHTML = '<div class="empty"><p style="color:#484f58">加载失败</p></div>'; });
}

/* 阅读：跳到独立阅读页（懒加载章节正文） */
function readFrom(btn) {
    var folder = btn.getAttribute('data-f') || '';
    var platform = btn.getAttribute('data-p') || 'fanqie';
    if (!folder) return showToast('缺少小说信息', 'warning');
    if (typeof navigateTo === 'function') navigateTo('/novels/read?platform=' + encodeURIComponent(platform) + '&folder=' + encodeURIComponent(folder));
    else window.location.href = '/novels/read?platform=' + encodeURIComponent(platform) + '&folder=' + encodeURIComponent(folder);
}

/* 去提取页分析：跳 /extract 并预选该书（步骤二列表高亮 + 滚动定位），用户在提取页点「分析提取」 */
function goExtractFrom(btn) {
    var title = btn.getAttribute('data-t') || '';
    var folder = btn.getAttribute('data-f') || '';
    var platform = btn.getAttribute('data-p') || 'fanqie';
    if (!title) return showToast('缺少书名', 'warning');
    var url = '/extract?title=' + encodeURIComponent(title)
            + '&folder=' + encodeURIComponent(folder)
            + '&platform=' + encodeURIComponent(platform);
    if (typeof navigateTo === 'function') navigateTo(url);
    else window.location.href = url;
}

function deleteFrom(btn) {
    var folder = btn.getAttribute('data-f') || '';
    var platform = btn.getAttribute('data-p') || 'fanqie';
    if (!folder) return;
    if (!confirm('确定删除已下载小说「' + folder + '」？删除后无法恢复（不影响已入库的五库素材）。')) return;
    fetch('/api/scout/novels/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({platform: platform, folder: folder}),
    }).then(function(r) { return r.json(); })
      .then(function(d) {
          if (d.ok) { showToast('🗑 已删除', 'success'); loadNovels(); }
          else showToast('❌ 删除失败: ' + (d.error||''), 'error');
      })
      .catch(function(e) { showToast('❌ 删除失败: ' + e.message, 'error'); });
}
</script>
{% endblock %}
