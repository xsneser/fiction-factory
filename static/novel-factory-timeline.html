<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说工厂 · 故事线</title>
<style>
  :root {
    --bg: #0f1117;
    --panel-bg: #161822;
    --border: #2a2d3a;
    --text: #c9d1d9;
    --text-dim: #6e7681;
    --text-bright: #e6edf3;
    --outline-1: #f97583;
    --outline-2: #79c0ff;
    --outline-3: #56d364;
    --outline-4: #e3b341;
    --outline-5: #d2a8ff;
    --plot-root: #79c0ff;
    --plot-child: #a5d6ff;
    --plot-child2: #c2e0ff;
    --laugh: #ffa657;
    --accent: #58a6ff;
    --axis: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    padding: 0;
  }

  .app {
    background: var(--panel-bg);
    border: none;
    border-radius: 0;
    width: 100%;
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1c2b;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-bright);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .header .meta { font-size: 10px; color: var(--text-dim); }
  .header .meta span { color: var(--text); margin: 0 4px; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
  }

  /* --- CHAPTER PANEL (left of axis) --- */
  .chapter-panel {
    width: 55px;
    position: relative;
    border-right: 1px solid var(--border);
    background: #13141d;
    flex-shrink: 0;
  }
  .chapter-panel .chapter-mark {
    position: absolute;
    left: 4px;
    right: 4px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .chapter-panel .chapter-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--accent);
  }
  .chapter-panel .chapter-line {
    position: absolute;
    left: 11px;
    right: 0;
    height: 1px;
    background: var(--axis);
  }
  .chapter-panel .chapter-num {
    font-size: 10px;
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
  }
  .chapter-panel .chapter-words {
    font-size: 9px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* --- AXIS --- */
  .axis-panel {
    width: 14px;
    position: relative;
    flex-shrink: 0;
  }
  .axis-panel .axis-line {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--axis), #484f5a 20%, #484f5a 80%, var(--axis));
    transform: translateX(-50%);
  }
  .axis-panel .tick {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 1px;
    background: var(--axis);
  }
  .axis-panel .tick-label {
    position: absolute;
    right: 4px;
    transform: translateY(-50%);
    font-size: 9px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* --- CONTENT AREA --- */
  .content-area {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .lane {
    flex: 1;
    position: relative;
    border-left: 1px solid var(--border);
    min-width: 0;
  }
  .lane:first-child { border-left: none; }

  .lane-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 4px 6px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-bright);
    background: linear-gradient(to bottom, rgba(22,24,34,.95), rgba(22,24,34,0));
    letter-spacing: 0px;
  }
  .lane-header .icon { margin-right: 4px; }

  .lane-body {
    position: absolute;
    top: 24px;
    left: 4px;
    right: 4px;
    bottom: 4px;
  }

  /* --- BARS --- */
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    border-radius: 4px;
    cursor: pointer;
    transition: filter .15s, box-shadow .15s;
    display: flex;
    align-items: center;
    padding: 0 8px;
    overflow: hidden;
    min-height: 4px;
  }
  .bar:hover {
    filter: brightness(1.3);
    z-index: 20;
    box-shadow: 0 0 16px rgba(0,0,0,.5);
  }
  .bar .bar-label {
    font-size: 10px;
    color: #fff;
    font-weight: 600;
    white-space: normal;
    word-break: break-all;
    line-height: 1.2;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none;
  }

  /* Outline bars */
  .bar-outline {
    border: 1px solid rgba(255,255,255,.15);
  }

  /* Plot bars - nesting levels */
  .bar-plot { left: 4px; right: 4px; }
  .bar-plot.level-0 { left: 0; right: 8px; z-index: 3; }
  .bar-plot.level-1 { left: 14px; right: 4px; z-index: 4; }
  .bar-plot.level-2 { left: 28px; right: 0; z-index: 5; }

  /* --- LAUGH POINTS --- */
  .laugh-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--laugh);
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    z-index: 10;
  }
  .laugh-dot:hover {
    transform: translate(-50%, -50%) scale(1.6);
    box-shadow: 0 0 14px var(--laugh);
    z-index: 30;
  }
  .laugh-dot .laugh-tag {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--laugh);
    white-space: nowrap;
    font-weight: 600;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .laugh-dot:hover .laugh-tag { opacity: 1; }

  /* 内涵 diamond marker */
  .theme-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #c084fc;
    transform: translate(-50%, -50%) rotate(45deg);
    border-radius: 2px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    z-index: 10;
  }
  .theme-dot:hover {
    transform: translate(-50%, -50%) rotate(45deg) scale(1.6);
    box-shadow: 0 0 14px #c084fc;
    z-index: 30;
  }
  .theme-dot .laugh-tag {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%) rotate(-45deg);
    font-size: 10px;
    color: #c084fc;
    white-space: nowrap;
    font-weight: 600;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .theme-dot:hover .laugh-tag { opacity: 1; }

  /* --- TOOLTIP --- */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #1e2130;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-bright);
    z-index: 1000;
    opacity: 0;
    transition: opacity .12s;
    box-shadow: 0 4px 20px rgba(0,0,0,.6);
    max-width: 280px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
  .tooltip .tt-row { display: flex; gap: 8px; color: var(--text-dim); font-size: 11px; }
  .tooltip .tt-row span { color: var(--text); }
  .tooltip .tt-tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    background: rgba(255,255,255,.08);
    color: var(--text);
    margin-top: 4px;
  }

  /* Legend */
  .legend {
    padding: 6px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-shrink: 0;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    color: var(--text-dim);
    background: #1a1c2b;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .legend-swatch.circle { border-radius: 50%; width: 8px; height: 8px; }

  /* Nesting connector lines */
  .nest-connector {
    position: absolute;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1><span class="dot"></span>故事线</h1>
    <div class="meta">
      总字数 <span>6,000</span> · 章节 <span>2</span> · 大纲 <span>4</span> · 桥段 <span>14</span>
    </div>
  </div>

  <!-- Main Visualization -->
  <div class="main" id="main">
    <!-- Chapter Panel -->
    <div class="chapter-panel" id="chapterPanel"></div>

    <!-- Axis -->
    <div class="axis-panel" id="axisPanel"></div>

    <!-- Content Lanes -->
    <div class="content-area" id="contentArea">
      <!-- Lane: 大纲 -->
      <div class="lane" id="laneOutlines" style="flex: 3;">
        <div class="lane-header">📋 大纲</div>
        <div class="lane-body" id="outlineBody"></div>
      </div>
      <!-- Lane: 桥段 -->
      <div class="lane" id="lanePlots" style="flex: 7;">
        <div class="lane-header">🔗 桥段</div>
        <div class="lane-body" id="plotBody"></div>
      </div>
      <!-- Lane: 笑点+内涵 -->
      <div class="lane" id="laneLaughs" style="flex: 2;">
        <div class="lane-header">😂💡 笑点 · 内涵</div>
        <div class="lane-body" id="laughBody"></div>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--outline-1)"></span> 大纲</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--plot-root)"></span> 主桥段</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--plot-child)"></span> 子桥段</div>
    <div class="legend-item"><span class="legend-swatch circle" style="background:var(--laugh)"></span> 笑点</div>
    <div class="legend-item"><span class="legend-swatch circle" style="background:#c084fc;transform:rotate(45deg);border-radius:2px"></span> 内涵</div>
    <div class="legend-item"><span class="legend-swatch circle" style="background:var(--accent)"></span> 章节分隔</div>
    <span style="margin-left:auto;font-size:10px;">悬停查看详情 · 大纲/桥段可拖拽调整</span>
  </div>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
const TOTAL_WORDS = 6000;

// --- DATA ---
const chapters = [
  { num: 1, words: 3000 },
  { num: 2, words: 6000 },
];

const outlines = [
  { id: 1, name: '都市奇遇 · 开篇起势', start: 0, end: 1500, color: '#f97583' },
  { id: 2, name: '金手指觉醒', start: 1000, end: 3000, color: '#79c0ff' },
  { id: 3, name: '世界观层层展开', start: 2500, end: 4500, color: '#56d364' },
  { id: 4, name: '首次大冲突 · 高潮', start: 4000, end: 5800, color: '#e3b341' },
];

const plots = [
  { id: 1, name: '主角登场 + 日常铺垫', start: 0, end: 700, parent: null, color: '#79c0ff' },
  { id: 2, name: '穿越前伏笔',     start: 100, end: 550, parent: 1, color: '#a5d6ff' },
  { id: 3, name: '意外穿越',       start: 700, end: 1200, parent: null, color: '#56d364' },
  { id: 4, name: '初识异世界',     start: 780, end: 1050, parent: 3, color: '#7ee787' },
  { id: 5, name: '获得金手指系统', start: 1200, end: 2000, parent: null, color: '#d2a8ff' },
  { id: 6, name: '系统功能探索',   start: 1280, end: 1650, parent: 5, color: '#e2c6ff' },
  { id: 7, name: '首次实战试用',   start: 1650, end: 1950, parent: 5, color: '#e2c6ff' },
  { id: 8, name: '冲突升级 + 装逼打脸', start: 2800, end: 4500, parent: null, color: '#f97583' },
  { id: 9, name: '反派登场',       start: 2900, end: 3500, parent: 8, color: '#ffa8b0' },
  { id: 10, name: '激烈对抗',      start: 3500, end: 4300, parent: 8, color: '#ffa8b0' },
  { id: 11, name: '胜利 + 收获',   start: 4300, end: 4700, parent: null, color: '#e3b341' },
  { id: 12, name: '新地图解锁',    start: 4700, end: 6000, parent: null, color: '#79c0ff' },
  { id: 13, name: '新势力登场',    start: 4850, end: 5400, parent: 12, color: '#a5d6ff' },
  { id: 14, name: '暗线埋设',      start: 5400, end: 5900, parent: 12, color: '#a5d6ff' },
];

const laughPoints = [
  { word: 200,  type: '吐槽',   desc: '主角对日常的犀利吐槽' },
  { word: 850,  type: '反差',   desc: '穿越后衣着/语言的尴尬反差' },
  { word: 1550, type: '搞笑',   desc: '系统精灵的毒舌教程' },
  { word: 2700, type: '反转',   desc: '你以为的强者其实是菜鸡' },
  { word: 3900, type: '吐槽',   desc: '战斗中突如其来的内心OS' },
  { word: 5200, type: '反差',   desc: '新势力首领的萌系外表' },
];

const themePoints = [
  { word: 350,  name: '命运无常',  technique: '对比/反差',     desc: '平凡日常对比即将到来的惊天变故' },
  { word: 1300, name: '成长代价',  technique: '角色行动展示',   desc: '获得力量伴随着失去' },
  { word: 2400, name: '弱者逆袭',  technique: '群像反应',       desc: '路人质疑→打脸→群体震惊' },
  { word: 3800, name: '人性考验',  technique: '对话间接暗示',   desc: '危机时刻的角色立场选择' },
  { word: 5000, name: '格局暗示',  technique: '环境/象征物呼应', desc: '新地图暗藏更大世界伏笔' },
];

// --- RENDER ---
function wordToPercent(words) {
  return (words / TOTAL_WORDS) * 100;
}

function wordToPx(words, containerHeight) {
  return (words / TOTAL_WORDS) * containerHeight;
}

// Chapter panel + axis
function renderChapters() {
  const panel = document.getElementById('chapterPanel');
  const axis = document.getElementById('axisPanel');
  panel.innerHTML = '';
  axis.innerHTML = '<div class="axis-line"></div>';

  const panelH = panel.clientHeight;

  // Tick marks every 1000 words
  for (let w = 0; w <= TOTAL_WORDS; w += 1000) {
    const yPct = wordToPercent(w);
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.top = yPct + '%';
    axis.appendChild(tick);

    const label = document.createElement('div');
    label.className = 'tick-label';
    label.style.top = yPct + '%';
    label.textContent = w;
    axis.appendChild(label);
  }

  chapters.forEach(ch => {
    const yPct = wordToPercent(ch.words);
    const yPx = wordToPx(ch.words, panelH);

    // Dot + label
    const mark = document.createElement('div');
    mark.className = 'chapter-mark';
    mark.style.top = yPct + '%';
    mark.innerHTML = `
      <div class="chapter-dot"></div>
      <div>
        <div class="chapter-num">第${ch.num}章</div>
        <div class="chapter-words">${ch.words.toLocaleString()}字</div>
      </div>
    `;
    panel.appendChild(mark);

    // Dashed line across
    const line = document.createElement('div');
    line.className = 'chapter-line';
    line.style.top = yPct + '%';
    line.style.borderTop = '1px dashed rgba(88,166,255,.25)';
    panel.appendChild(line);
  });
}

// --- GANTT LANE ASSIGNMENT ---
// Assign overlapping items to non-overlapping horizontal lanes
function assignLanes(items) {
  // Sort by start, then by end (longer first) for stable layout
  const sorted = items.map((it, i) => ({ ...it, _idx: i }))
    .sort((a, b) => a.start - b.start || b.end - a.end);

  const lanes = []; // lanes[i] = end word of the last item in lane i
  const assignments = new Array(items.length);

  sorted.forEach(item => {
    // Find first free lane at item.start
    let lane = 0;
    while (lane < lanes.length && lanes[lane] > item.start) {
      lane++;
    }
    lanes[lane] = item.end;
    assignments[item._idx] = lane;
  });

  const totalLanes = lanes.length;
  return { assignments, totalLanes };
}

// Outlines
function renderOutlines() {
  const body = document.getElementById('outlineBody');
  const h = body.clientHeight;
  const w = body.clientWidth;
  body.innerHTML = '';

  const { assignments, totalLanes } = assignLanes(outlines);

  outlines.forEach((o, i) => {
    const lane = assignments[i];
    const top = wordToPercent(o.start);
    const height = wordToPercent(o.end - o.start);
    const laneW = 100 / totalLanes;
    const gap = 3; // px between lanes

    const bar = document.createElement('div');
    bar.className = 'bar bar-outline';
    bar.style.top = top + '%';
    bar.style.height = Math.max(height, 0.5) + '%';
    bar.style.background = `linear-gradient(135deg, ${o.color}, ${o.color}cc)`;
    bar.style.left = `calc(${lane * laneW}% + ${lane * gap}px)`;
    bar.style.width = `calc(${laneW}% - ${totalLanes * gap}px)`;
    bar.style.right = 'auto';
    bar.style.zIndex = 10;
    bar.dataset.tooltip = JSON.stringify({
      title: o.name,
      rows: [
        ['范围', `${o.start.toLocaleString()} — ${o.end.toLocaleString()} 字`],
        ['跨度', `${(o.end - o.start).toLocaleString()} 字`],
      ],
      tag: '大纲线',
    });

    if (height > 1.2) {
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = o.name;
      label.style.fontSize = '10px';
      bar.appendChild(label);
    }

    bar.addEventListener('mouseenter', showTooltip);
    bar.addEventListener('mousemove', moveTooltip);
    bar.addEventListener('mouseleave', hideTooltip);
    body.appendChild(bar);
  });
}

// Plots with nesting + lane assignment within each level
function renderPlots() {
  const body = document.getElementById('plotBody');
  const bodyW = body.clientWidth;
  const bodyH = body.clientHeight;
  body.innerHTML = '';

  // Compute nesting levels
  function getLevel(plot, depth) {
    depth = depth || 0;
    if (plot.parent === null) return 0;
    const parent = plots.find(p => p.id === plot.parent);
    return parent ? getLevel(parent) + 1 : 0;
  }

  const plotLevels = {};
  plots.forEach(p => { plotLevels[p.id] = getLevel(p); });
  const maxLevel = Math.max(...Object.values(plotLevels));

  // Group plots by level
  const byLevel = {};
  plots.forEach(p => {
    const lv = plotLevels[p.id];
    if (!byLevel[lv]) byLevel[lv] = [];
    byLevel[lv].push({ id: p.id, start: p.start, end: p.end });
  });

  // Assign lanes within each level group
  const laneInfo = {}; // plotId -> { lane, totalLanes }
  for (const [lv, items] of Object.entries(byLevel)) {
    const { assignments, totalLanes } = assignLanes(items);
    items.forEach((it, idx) => {
      laneInfo[it.id] = { lane: assignments[idx], totalLanes };
    });
  }

  // Layout: each nesting level gets a horizontal block
  const levelBlockW = 100 / (maxLevel + 1);
  const gap = 3;

  plots.forEach(p => {
    const level = plotLevels[p.id];
    const { lane, totalLanes } = laneInfo[p.id] || { lane: 0, totalLanes: 1 };
    const top = wordToPercent(p.start);
    const height = wordToPercent(p.end - p.start);

    // Horizontal: level block offset + lane within block
    const blockLeft = level * levelBlockW;
    const laneW = 100 / totalLanes;
    const innerLeft = lane * laneW;
    const barLeft = blockLeft + innerLeft * (levelBlockW / 100);
    const barW = levelBlockW / totalLanes - gap;

    const bar = document.createElement('div');
    bar.className = 'bar bar-plot';
    bar.style.top = top + '%';
    bar.style.height = Math.max(height, 0.4) + '%';
    bar.style.left = barLeft + '%';
    bar.style.width = `calc(${barW}% - ${totalLanes * gap}px)`;
    bar.style.right = 'auto';
    bar.style.zIndex = 5 + level;

    if (level === 0) {
      bar.style.background = `linear-gradient(135deg, ${p.color}, ${p.color}cc)`;
      bar.style.border = '1px solid rgba(255,255,255,.2)';
    } else if (level === 1) {
      bar.style.background = `linear-gradient(135deg, ${p.color}99, ${p.color}88)`;
      bar.style.borderLeft = '2px solid rgba(255,255,255,.3)';
    } else {
      bar.style.background = `linear-gradient(135deg, ${p.color}77, ${p.color}55)`;
      bar.style.borderLeft = '2px solid rgba(255,255,255,.2)';
    }

    bar.dataset.tooltip = JSON.stringify({
      title: p.name,
      rows: [
        ['范围', `${p.start.toLocaleString()} — ${p.end.toLocaleString()} 字`],
        ['跨度', `${(p.end - p.start).toLocaleString()} 字`],
        ['层级', level === 0 ? '主桥段' : `子桥段 L${level}`],
      ],
      tag: '桥段',
    });

    if (height > 1.0) {
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = p.name;
      label.style.fontSize = Math.min(9, Math.max(7, height * 0.3)) + 'px';
      bar.appendChild(label);
    }

    bar.addEventListener('mouseenter', showTooltip);
    bar.addEventListener('mousemove', moveTooltip);
    bar.addEventListener('mouseleave', hideTooltip);
    body.appendChild(bar);
  });

  // --- Nesting connectors ---
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.style.position = 'absolute';
  svg.style.top = '0';
  svg.style.left = '0';
  svg.style.pointerEvents = 'none';
  svg.style.zIndex = '0';

  plots.forEach(p => {
    if (p.parent === null) return;
    const parent = plots.find(pp => pp.id === p.parent);
    if (!parent) return;

    const pLevel = plotLevels[p.id];
    const parentLevel = plotLevels[parent.id];
    const parentLI = laneInfo[parent.id];
    const childLI = laneInfo[p.id];
    if (!parentLI || !childLI) return;

    const parentMid = wordToPercent((parent.start + parent.end) / 2);
    const childMid = wordToPercent((p.start + p.end) / 2);

    // Compute center X of each bar
    function barCenterX(level, lane, totalLanes) {
      const blockL = (level / (maxLevel + 1)) * 100;
      const laneW = (1 / (maxLevel + 1)) * 100 / totalLanes;
      return blockL + lane * laneW + laneW / 2;
    }

    const parentCx = barCenterX(parentLevel, parentLI.lane, parentLI.totalLanes);
    const childCx = barCenterX(pLevel, childLI.lane, childLI.totalLanes);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const midY = (parentMid + childMid) / 2;
    const d = `M ${parentCx}% ${parentMid}% C ${parentCx}% ${midY}%, ${childCx}% ${midY}%, ${childCx}% ${childMid}%`;
    path.setAttribute('d', d);
    path.setAttribute('stroke', 'rgba(255,255,255,0.1)');
    path.setAttribute('stroke-width', '1');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });

  body.appendChild(svg);
}

// Laugh + Theme points
function renderLaughs() {
  const body = document.getElementById('laughBody');
  body.innerHTML = '';

  // --- Laugh points (circles, left side of lane) ---
  laughPoints.forEach(lp => {
    const leftPct = 35;
    const topPct = wordToPercent(lp.word);

    const dot = document.createElement('div');
    dot.className = 'laugh-dot';
    dot.style.left = leftPct + '%';
    dot.style.top = topPct + '%';
    dot.innerHTML = `<span class="laugh-tag">${lp.type}</span>`;

    dot.dataset.tooltip = JSON.stringify({
      title: `😂 ${lp.type}`,
      rows: [['位置', `${lp.word.toLocaleString()} 字`]],
      desc: lp.desc,
      tag: '笑点',
    });

    dot.addEventListener('mouseenter', showTooltip);
    dot.addEventListener('mousemove', moveTooltip);
    dot.addEventListener('mouseleave', hideTooltip);
    body.appendChild(dot);
  });

  // --- Theme points (diamonds, right side of lane) ---
  themePoints.forEach(tp => {
    const leftPct = 65;
    const topPct = wordToPercent(tp.word);

    const dot = document.createElement('div');
    dot.className = 'theme-dot';
    dot.style.left = leftPct + '%';
    dot.style.top = topPct + '%';
    dot.innerHTML = `<span class="laugh-tag">${tp.name}</span>`;

    dot.dataset.tooltip = JSON.stringify({
      title: `💡 ${tp.name}`,
      rows: [
        ['位置', `${tp.word.toLocaleString()} 字`],
        ['手法', tp.technique],
      ],
      desc: tp.desc,
      tag: '内涵',
    });

    dot.addEventListener('mouseenter', showTooltip);
    dot.addEventListener('mousemove', moveTooltip);
    dot.addEventListener('mouseleave', hideTooltip);
    body.appendChild(dot);
  });
}

// --- TOOLTIP ---
const tooltip = document.getElementById('tooltip');

function showTooltip(e) {
  const data = JSON.parse(e.currentTarget.dataset.tooltip);
  let html = `<div class="tt-title">${data.title}</div>`;
  if (data.rows) {
    data.rows.forEach(r => {
      html += `<div class="tt-row">${r[0]}: <span>${r[1]}</span></div>`;
    });
  }
  if (data.desc) {
    html += `<div class="tt-row" style="margin-top:4px;color:#8b949e;">${data.desc}</div>`;
  }
  html += `<div class="tt-tag">${data.tag}</div>`;
  tooltip.innerHTML = html;
  tooltip.classList.add('show');
}

function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('show');
}

// --- RENDER ALL ---
function renderAll() {
  renderChapters();
  renderOutlines();
  renderPlots();
  renderLaughs();
}

// Initial render + resize handler
renderAll();
window.addEventListener('resize', renderAll);
</script>
</body>
